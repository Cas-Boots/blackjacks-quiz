<title>Blackjacks Kwis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ---------------------------------------------------------------
   Blackjacks Kwis — een kaarttafel om middernacht.
   Bewust één visuele wereld (donker vilt): dit is een presentatie-
   scherm voor een donkere kamer, bedoeld voor een grote televisie.
   Alle kleuren expliciet gezet.
   --------------------------------------------------------------- */
:root{
  --inkt:#08130F;
  --vilt:#0D1E18;
  --vilt-hoog:#142C23;
  --vilt-diep:#0A1813;
  --rand:#23453A;
  --rand-zacht:#1A3229;
  --ivoor:#F5F0E4;
  --ivoor-zacht:#D8D2C2;
  --salie:#8AA096;
  --salie-diep:#5E736A;
  --goud:#C9A227;
  --goud-licht:#EBD27C;
  --goud-diep:#8A6E14;
  --rood:#C0452F;
  --rood-licht:#E4705A;
  --groen:#4E9A6B;
  --groen-licht:#78C495;
  --kaart:#14201B;

  --sp-1:.35rem; --sp-2:.65rem; --sp-3:1rem; --sp-4:1.5rem;
  --sp-5:2.25rem; --sp-6:3.25rem;
  --radius:14px;

  /* Eén draaiknop voor de leesbaarheid op afstand. */
  --schaal:1;

  --fs-titel:    calc(var(--schaal) * clamp(2.4rem,7.5vw,7rem));
  --fs-kop:      calc(var(--schaal) * clamp(1.7rem,4.6vw,4rem));
  --fs-vraag:    calc(var(--schaal) * clamp(1.35rem,3.9vw,3.5rem));
  --fs-antwoord: calc(var(--schaal) * clamp(1.5rem,4.4vw,3.8rem));
  --fs-keuze:    calc(var(--schaal) * clamp(1rem,2.1vw,1.9rem));
  --fs-emoji:    calc(var(--schaal) * clamp(2.6rem,10vw,7rem));
  --fs-klok:     calc(var(--schaal) * clamp(1.6rem,4vw,3.6rem));
  --fs-naam:     calc(var(--schaal) * clamp(1.1rem,2.7vw,2.3rem));
  --fs-punten:   calc(var(--schaal) * clamp(1.05rem,2.4vw,2rem));
  --fs-lood:     calc(var(--schaal) * clamp(.95rem,1.35vw,1.4rem));
  --fs-railnaam: calc(var(--schaal) * clamp(.98rem,2vw,1.8rem));

  --display:"Bodoni Moda",Georgia,"Times New Roman",serif;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono","SFMono-Regular",Consolas,monospace;

  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--vilt);
  color:var(--ivoor);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--goud-licht);outline-offset:3px;border-radius:6px}

#app{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(120% 90% at 50% 0%, #17362B 0%, var(--vilt) 42%, var(--vilt-diep) 100%);
}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* ---- Bovenrail ------------------------------------------------- */
.rail{
  flex:0 0 auto;
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) clamp(16px,3vw,48px);
  padding-top:calc(var(--sp-2) + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,rgba(8,19,15,.92),rgba(8,19,15,.55));
  border-bottom:1px solid var(--rand-zacht);
  position:relative;z-index:20;
}
.rail[hidden]{display:none}
.rail-suit{font-size:calc(var(--fs-railnaam) * 1.1);color:var(--goud);line-height:1}
.rail-suit.is-rood{color:var(--rood-licht)}
.rail-info{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.rail-ronde{
  font-size:calc(var(--schaal) * clamp(.66rem,.9vw,1rem));
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--salie);font-weight:600;
}
.rail-naam{
  font-family:var(--display);font-size:var(--fs-railnaam);line-height:1.15;
  color:var(--ivoor);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rail-teller{
  font-family:var(--mono);
  font-size:calc(var(--schaal) * clamp(.82rem,1.1vw,1.25rem));
  color:var(--salie);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.klok{
  font-family:var(--mono);font-size:var(--fs-klok);font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--goud-licht);
  line-height:1;min-width:2.6ch;text-align:right;
}
.klok.is-waarschuwing{color:var(--goud)}
.klok.is-kritiek{color:var(--rood-licht);animation:pols .9s ease-in-out infinite}
.klok.is-uit{color:var(--salie-diep)}
@keyframes pols{50%{opacity:.45}}
.balk{
  position:absolute;left:0;bottom:-1px;height:3px;
  background:linear-gradient(90deg,var(--goud-diep),var(--goud-licht));
  width:100%;transform-origin:left center;z-index:21;
}
.balk.is-kritiek{background:linear-gradient(90deg,#7A2418,var(--rood-licht))}

/* ---- Speelvlak ------------------------------------------------- */
#podium{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
  padding-inline:clamp(16px,3vw,48px);
  padding-block:clamp(18px,3vh,44px);
}
.vlak{
  width:100%;max-width:min(1500px,100%);margin:0 auto;
  display:flex;flex-direction:column;gap:var(--sp-4);flex:1 1 auto;
  animation:opkomen .32s cubic-bezier(.2,.7,.3,1) both;
}
.vlak.is-gecentreerd{justify-content:center;text-align:center;align-items:center}
@keyframes opkomen{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .vlak{animation:none}
  .klok.is-kritiek{animation:none}
}
/* Grote televisies: ruimer kader, weg van de overscanrand. */
@media (min-width:1500px){
  #podium{padding-inline:clamp(48px,5vw,120px)}
  .rail{padding-inline:clamp(48px,5vw,120px)}
  .besturing{padding-inline:clamp(40px,4vw,100px)}
}

/* ---- Typografie ------------------------------------------------ */
.opschrift{
  font-size:calc(var(--schaal) * clamp(.68rem,.92vw,1.05rem));
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--goud);font-weight:600;margin:0;
}
.opschrift.is-stil{color:var(--salie)}
h1.titel{
  font-family:var(--display);font-size:var(--fs-titel);
  font-weight:700;line-height:.98;margin:0;text-wrap:balance;color:var(--ivoor);
}
h2.kop{
  font-family:var(--display);font-size:var(--fs-kop);
  font-weight:600;line-height:1.05;margin:0;text-wrap:balance;color:var(--ivoor);
}
h3.subkop{font-family:var(--ui);font-size:.95rem;font-weight:600;margin:0;color:var(--ivoor-zacht)}
p.lood{margin:0;color:var(--ivoor-zacht);font-size:var(--fs-lood);max-width:62ch;text-wrap:pretty}
p.fijn{margin:0;color:var(--salie);font-size:.85rem;max-width:66ch}

/* ---- De vraag (het enige kaartobject op de pagina) -------------- */
.vraagkaart{
  background:linear-gradient(170deg,#FBF8EF,#EDE6D4);
  color:var(--kaart);border-radius:var(--radius);
  padding:clamp(20px,3vw,48px);
  box-shadow:0 22px 50px -18px rgba(0,0,0,.75), 0 0 0 1px rgba(201,162,39,.35);
  display:flex;flex-direction:column;gap:var(--sp-3);position:relative;
}
.vraagkaart::after{
  content:attr(data-suit);position:absolute;
  right:clamp(14px,2vw,26px);bottom:clamp(8px,1.5vw,16px);
  font-size:clamp(2rem,5vw,4rem);color:rgba(20,32,27,.07);
  line-height:1;pointer-events:none;
}
.vraagtekst{
  font-family:var(--display);font-size:var(--fs-vraag);
  font-weight:600;line-height:1.16;margin:0;text-wrap:balance;color:var(--kaart);
}
.vraagtekst.is-klein{font-size:calc(var(--fs-vraag) * .55)}
.emoji-raadsel{
  font-size:var(--fs-emoji);line-height:1.25;letter-spacing:.08em;
  text-align:center;margin:var(--sp-2) 0;word-break:break-word;
}
.emoji-raadsel.is-klein{font-size:calc(var(--fs-emoji) * .5)}
.lyric{
  font-family:var(--display);font-style:italic;font-size:var(--fs-vraag);
  line-height:1.25;color:var(--kaart);margin:0;text-wrap:balance;
}
.lyric.is-klein{font-size:calc(var(--fs-vraag) * .5)}
.lyric::before{content:"\201C"}
.lyric::after{content:"\201D"}

/* ---- Media in de vraag ----------------------------------------- */
.vraagmedia{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.vraagmedia img,.vraagmedia video{
  width:100%;max-width:100%;max-height:52vh;
  border-radius:10px;display:block;background:#000;
}
.vraagmedia img{object-fit:contain}
.vraagmedia.is-klein img,.vraagmedia.is-klein video{max-height:24vh}
.mediabijschrift{font-size:.8rem;color:rgba(20,32,27,.55);margin:0}
.media-mist{
  border:1.5px dashed rgba(20,32,27,.3);border-radius:10px;
  padding:var(--sp-4) var(--sp-3);text-align:center;
  color:rgba(20,32,27,.6);font-size:.9rem;
  display:flex;flex-direction:column;gap:var(--sp-1);
}
.media-mist strong{color:var(--kaart);font-family:var(--mono);font-size:.85rem}

.audiospeler{
  display:flex;align-items:center;gap:var(--sp-3);
  background:rgba(20,32,27,.06);border:1px solid rgba(20,32,27,.14);
  border-radius:12px;padding:clamp(12px,1.6vw,20px);
}
.audio-knop{
  width:clamp(3rem,5vw,4.5rem);height:clamp(3rem,5vw,4.5rem);flex:0 0 auto;
  border-radius:50%;border:none;background:var(--kaart);color:var(--ivoor);
  font-size:clamp(1.1rem,2vw,1.7rem);cursor:pointer;display:grid;place-items:center;
  transition:transform .08s;
}
.audio-knop:hover{background:#1E3229}
.audio-knop:active{transform:scale(.94)}
.audio-romp{flex:1 1 auto;display:flex;flex-direction:column;gap:.45rem;min-width:0}
.audio-balk{
  height:8px;background:rgba(20,32,27,.16);border-radius:4px;
  cursor:pointer;position:relative;overflow:hidden;
}
.audio-voortgang{height:100%;background:var(--kaart);border-radius:4px;width:0}
.audio-tijd{
  font-family:var(--mono);font-size:.82rem;color:rgba(20,32,27,.6);
  font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;
}
.audio-titel{font-size:.85rem;color:rgba(20,32,27,.75);font-weight:500}

/* ---- Keuzes ---------------------------------------------------- */
.keuzes{display:grid;gap:var(--sp-2);grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.keuze{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:clamp(12px,1.5vw,22px) clamp(14px,1.6vw,24px);
  background:rgba(20,32,27,.055);border:1px solid rgba(20,32,27,.14);
  border-radius:10px;font-size:var(--fs-keuze);color:var(--kaart);text-align:left;
}
.keuze-letter{
  font-family:var(--mono);font-size:calc(var(--fs-keuze) * .72);font-weight:500;
  width:1.9em;height:1.9em;flex:0 0 auto;display:grid;place-items:center;
  border-radius:50%;background:var(--kaart);color:var(--ivoor);
}
.keuze.is-goed{background:rgba(78,154,107,.18);border-color:var(--groen);box-shadow:inset 0 0 0 1px var(--groen)}
.keuze.is-goed .keuze-letter{background:var(--groen)}

/* ---- Antwoordonthulling ---------------------------------------- */
.onthulling{
  background:var(--vilt-hoog);border:1px solid var(--rand);
  border-left:3px solid var(--groen);border-radius:var(--radius);
  padding:clamp(16px,2.4vw,32px);display:flex;flex-direction:column;gap:var(--sp-2);
}
.antwoordtekst{
  font-family:var(--display);font-size:var(--fs-antwoord);
  font-weight:600;line-height:1.1;margin:0;color:var(--groen-licht);text-wrap:balance;
}
.toelichting{margin:0;color:var(--ivoor-zacht);font-size:var(--fs-lood);max-width:66ch}

/* ---- Portretjes ------------------------------------------------ */
.avatar{
  border-radius:50%;object-fit:cover;flex:0 0 auto;overflow:hidden;
  background:var(--vilt-diep);border:1px solid var(--rand);
  display:grid;place-items:center;
  font-family:var(--ui);font-weight:600;color:var(--goud-licht);
  text-transform:uppercase;letter-spacing:.02em;line-height:1;
}
.avatar-s{width:2rem;height:2rem;font-size:.72rem}
.avatar-m{width:2.75rem;height:2.75rem;font-size:.9rem}
.avatar-l{width:clamp(3rem,5vw,5rem);height:clamp(3rem,5vw,5rem);font-size:clamp(1rem,1.6vw,1.6rem)}
.avatar-xl{width:clamp(4.5rem,9vw,9rem);height:clamp(4.5rem,9vw,9rem);font-size:clamp(1.4rem,2.6vw,2.8rem)}
.avatar.is-goud{border-color:var(--goud)}
.avatar-knop{padding:0;border:none;background:none;cursor:pointer;position:relative;flex:0 0 auto}
.avatar-knop .wissel{
  position:absolute;right:-2px;bottom:-2px;
  width:1.15rem;height:1.15rem;border-radius:50%;
  background:var(--goud);color:var(--inkt);
  font-size:.62rem;display:grid;place-items:center;
  border:2px solid var(--vilt);
}

/* ---- Teams ----------------------------------------------------- */
.teamgrid{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.teamkaart{
  background:var(--vilt-hoog);border:1px solid var(--rand);border-radius:var(--radius);
  padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2);
}
.teamkaart-kop{
  display:flex;align-items:center;gap:var(--sp-2);
  font-family:var(--display);font-size:calc(var(--schaal) * clamp(1.15rem,1.8vw,1.8rem));
  font-weight:600;color:var(--goud-licht);
}
.teamkaart-kop .suit{font-size:1.25em}
.teamkaart-kop .suit.is-rood{color:var(--rood-licht)}
.chiprij{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chip{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.3rem .75rem .3rem .3rem;border-radius:999px;
  background:var(--vilt-diep);border:1px solid var(--rand);
  color:var(--ivoor-zacht);font-size:calc(var(--schaal) * clamp(.85rem,1.2vw,1.15rem));
  cursor:pointer;transition:border-color .15s,color .15s;
}
.chip:hover{border-color:var(--goud-diep);color:var(--ivoor)}
.chip.is-vast{cursor:default}
.chip.is-vast:hover{border-color:var(--rand);color:var(--ivoor-zacht)}

/* ---- Klassement ------------------------------------------------ */
.klassement{display:flex;flex-direction:column;gap:2px;width:100%}
.klassement-rij{
  display:grid;grid-template-columns:2.2rem auto 1fr auto;
  align-items:center;gap:var(--sp-3);
  padding:clamp(8px,1.4vh,18px) var(--sp-3);
  border-bottom:1px solid var(--rand-zacht);
}
.klassement-rij:first-child{
  background:linear-gradient(90deg,rgba(201,162,39,.14),transparent 70%);
  border-bottom-color:var(--goud-diep);
}
.klassement-plek{font-family:var(--mono);font-size:calc(var(--fs-naam)*.6);color:var(--salie);font-variant-numeric:tabular-nums}
.klassement-rij:first-child .klassement-plek{color:var(--goud)}
.klassement-naam{
  font-family:var(--display);font-size:var(--fs-naam);font-weight:600;color:var(--ivoor);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.klassement-punten{
  font-family:var(--mono);font-size:var(--fs-punten);
  color:var(--goud-licht);font-variant-numeric:tabular-nums;
}
.klassement-delta{font-family:var(--mono);font-size:.6em;color:var(--groen-licht);margin-left:.4rem}

/* ---- Podium ---------------------------------------------------- */
.podiumrij{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));width:100%;align-items:end}
.podiumplek{
  background:var(--vilt-hoog);border:1px solid var(--rand);border-radius:var(--radius);
  padding:var(--sp-4) var(--sp-3);display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
}
.podiumplek.is-eerste{
  background:linear-gradient(180deg,rgba(201,162,39,.2),var(--vilt-hoog));
  border-color:var(--goud);box-shadow:0 0 44px -14px rgba(201,162,39,.6);
}
.podium-medaille{font-size:clamp(1.8rem,3.4vw,3.2rem);line-height:1}
.podium-naam{font-family:var(--display);font-size:calc(var(--fs-naam)*.95);font-weight:600;color:var(--ivoor);text-align:center}
.podium-punten{font-family:var(--mono);color:var(--goud-licht);font-size:calc(var(--fs-punten)*.75)}

/* ---- Puntentoekenning ------------------------------------------ */
.toekennen{display:flex;flex-direction:column;gap:var(--sp-2)}
.toekennen-rij{display:grid;gap:var(--sp-2);grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}
.punt-knop{
  display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);
  background:var(--vilt-hoog);border:1px solid var(--rand);border-radius:10px;
  color:var(--ivoor-zacht);cursor:pointer;text-align:left;
  transition:background .15s,border-color .15s,color .15s;
  font-size:calc(var(--schaal) * clamp(.95rem,1.3vw,1.25rem));
}
.punt-knop:hover{border-color:var(--salie-diep);background:#193527}
.punt-knop.is-toegekend{background:rgba(78,154,107,.16);border-color:var(--groen);color:var(--ivoor)}
.punt-vink{
  width:1.55rem;height:1.55rem;flex:0 0 auto;border-radius:50%;
  border:1.5px solid var(--salie-diep);display:grid;place-items:center;
  font-size:.85rem;color:transparent;
}
.punt-knop.is-toegekend .punt-vink{background:var(--groen);border-color:var(--groen);color:#08130F}
.punt-naam{flex:1 1 auto;min-width:0}
.punt-leden{display:block;font-size:.72em;color:var(--salie);margin-top:1px}

/* ---- Formulieren ----------------------------------------------- */
.veld{display:flex;flex-direction:column;gap:var(--sp-1)}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:.7rem .85rem;background:var(--vilt-diep);
  border:1px solid var(--rand);border-radius:8px;color:var(--ivoor);
  font-family:var(--ui);font-size:1rem;
}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{font-family:var(--mono);font-size:.8rem;line-height:1.5;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--salie-diep)}
input:focus,textarea:focus,select:focus{border-color:var(--goud-diep);outline:none}
input[type=file]{display:none}

.spelerlijst{display:flex;flex-direction:column;gap:var(--sp-2)}
.spelerrij{display:flex;align-items:center;gap:var(--sp-2)}
.spelerrij .volgnr{font-family:var(--mono);font-size:.8rem;color:var(--salie-diep);width:1.3rem;flex:0 0 auto;text-align:right}

/* ---- Knoppen --------------------------------------------------- */
.knop{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.72rem 1.25rem;border-radius:9px;border:1px solid var(--rand);
  background:var(--vilt-hoog);color:var(--ivoor-zacht);
  font-size:.9rem;font-weight:500;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s,transform .08s;white-space:nowrap;
}
.knop:hover{background:#1B3A2C;border-color:var(--salie-diep);color:var(--ivoor)}
.knop:active{transform:translateY(1px)}
.knop[disabled]{opacity:.35;cursor:not-allowed}
.knop.is-hoofd{
  background:linear-gradient(180deg,var(--goud-licht),var(--goud));
  border-color:var(--goud-licht);color:#1A1405;font-weight:700;
  box-shadow:0 8px 24px -10px rgba(201,162,39,.8);
}
.knop.is-hoofd:hover{background:linear-gradient(180deg,#F4DE95,var(--goud-licht));color:#1A1405}
.knop.is-groot{padding:.95rem 1.9rem;font-size:1.02rem}
.knop.is-stil{background:transparent;border-color:transparent;color:var(--salie)}
.knop.is-stil:hover{background:var(--vilt-hoog);color:var(--ivoor)}
.knop.is-gevaar:hover{border-color:var(--rood);color:var(--rood-licht);background:rgba(192,69,47,.12)}

function standaardSelectie(pakketId){
  const uit = {};
  PAKKETTEN[pakketId].rondes.forEach((r,ri) => {
    uit[ri] = r.optioneel ? [] : r.vragen.map((_,i) => i);
  });
  return uit;
}
function selectieVan(pakketId){
  if(!S.selectie[pakketId]) S.selectie[pakketId] = standaardSelectie(pakketId);
  return S.selectie[pakketId];
}
function vraagAan(pakketId, ri, vi){
  return (selectieVan(pakketId)[ri] || []).indexOf(vi) >= 0;
}
function wisselVraag(pakketId, ri, vi){
  const sel = selectieVan(pakketId);
  const lijst = (sel[ri] || []).slice();
  const i = lijst.indexOf(vi);
  if(i >= 0) lijst.splice(i,1); else lijst.push(vi);
  lijst.sort((a,b) => a - b);
  sel[ri] = lijst;
  bewaar();
}
function wisselRonde(pakketId, ri){
  const sel = selectieVan(pakketId);
  const alles = PAKKETTEN[pakketId].rondes[ri].vragen.map((_,i) => i);
  sel[ri] = (sel[ri] || []).length ? [] : alles;
  bewaar();
}
function gekozenAantal(pakketId){
  const sel = selectieVan(pakketId);
  let vragenTotaal = 0, rondesTotaal = 0;
  PAKKETTEN[pakketId].rondes.forEach((r,ri) => {
    const n = (sel[ri] || []).length;
    if(n){ rondesTotaal++; vragenTotaal += n; }
  });
  return {rondes: rondesTotaal, vragen: vragenTotaal};
}
function stelSamen(){
  const p = PAKKETTEN[S.pakket];
  const sel = selectieVan(S.pakket);
  const lijst = [];
  p.rondes.forEach((r,ri) => {
    const idx = (sel[ri] || []).slice().sort((a,b) => a - b);
    if(!idx.length) return;
    lijst.push(Object.assign({}, r, {vragen: idx.map(i => r.vragen[i]).filter(Boolean)}));
  });
  return {naam: p.naam, pakket: S.pakket, rondes: lijst};
}

/* -----------------------------------------------------------------
   MEDIABIBLIOTHEEK — eigen foto's, video's en muziek
   Bestanden gaan in IndexedDB, zodat ze een herlaadbeurt overleven
   en niet tegen de kleine localStorage-limiet aanlopen.
   ----------------------------------------------------------------- */
const MEDIA = {db:null, blobs:new Map(), urls:new Map(), gereed:false};

function mediaOpenDb(){
  return new Promise((res) => {
    try{
      if(!window.indexedDB) return res(null);
      const req = indexedDB.open("blackjacks-media", 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains("bestanden")) db.createObjectStore("bestanden");
      };
      req.onsuccess = (e) => res(e.target.result);
      req.onerror = () => res(null);
      req.onblocked = () => res(null);
    }catch(e){ res(null); }
  });
}
function mediaOnthoud(naam, blob){
  MEDIA.blobs.set(naam, blob);
  const oud = MEDIA.urls.get(naam);
  if(oud) URL.revokeObjectURL(oud);
  MEDIA.urls.set(naam, URL.createObjectURL(blob));
}
async function mediaLaadAlles(){
  MEDIA.db = await mediaOpenDb();
  if(!MEDIA.db){ MEDIA.gereed = true; return; }
  await new Promise((res) => {
    try{
      const tx = MEDIA.db.transaction("bestanden","readonly");
      const cur = tx.objectStore("bestanden").openCursor();
      cur.onsuccess = (e) => {
        const c = e.target.result;
        if(c){ mediaOnthoud(c.key, c.value); c.continue(); } else res();
      };
      cur.onerror = () => res();
    }catch(e){ res(); }
  });
  MEDIA.gereed = true;
}
function mediaBewaar(naam, blob){
  mediaOnthoud(naam, blob);
  if(!MEDIA.db) return Promise.resolve(false);
  return new Promise((res) => {
    try{
      const tx = MEDIA.db.transaction("bestanden","readwrite");
      tx.objectStore("bestanden").put(blob, naam);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    }catch(e){ res(false); }
  });
}
function mediaWis(naam){
  const url = MEDIA.urls.get(naam);
  if(url) URL.revokeObjectURL(url);
  MEDIA.urls.delete(naam); MEDIA.blobs.delete(naam);
  if(!MEDIA.db) return Promise.resolve();
  return new Promise((res) => {
    try{
      const tx = MEDIA.db.transaction("bestanden","readwrite");
      tx.objectStore("bestanden").delete(naam);
      tx.oncomplete = () => res(); tx.onerror = () => res();
    }catch(e){ res(); }
  });
}
function mediaBron(m){
  if(!m || !m.bron) return null;
  if(/^(data:|blob:|https?:)/i.test(m.bron)) return m.bron;
  return MEDIA.urls.get(m.bron) || null;
}
/* Welke bestandsnamen vraagt dit pakket, en welke daarvan hebben we? */
function mediaBehoefte(pakketId){
  const nodig = [];
  PAKKETTEN[pakketId].rondes.forEach((r,ri) => {
    r.vragen.forEach((q,vi) => {
      if(q.media && q.media.bron && !/^(data:|blob:|https?:)/i.test(q.media.bron)){
        nodig.push({bestand:q.media.bron, soort:q.media.soort, ri, vi, gekozen:vraagAan(pakketId, ri, vi)});
      }
    });
  });
  return nodig;
}
function maatTekst(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024*1024) return Math.round(bytes/1024) + " kB";
  return (bytes/1048576).toFixed(1).replace(".",",") + " MB";
}
const SOORTICOON = {beeld:"🖼️", video:"🎬", muziek:"🎵"};
function soortVanBestand(naam, type){
  const t = (type || "").toLowerCase();
  if(t.startsWith("image/")) return "beeld";
  if(t.startsWith("video/")) return "video";
  if(t.startsWith("audio/")) return "muziek";
  if(/\.(jpe?g|png|gif|webp|avif|svg)$/i.test(naam)) return "beeld";
  if(/\.(mp4|webm|mov|m4v|ogv)$/i.test(naam)) return "video";
  if(/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(naam)) return "muziek";
  return "beeld";
}

/* -----------------------------------------------------------------
   PORTRETJES — verkleind tot een vierkant, zodat ze in de
   browseropslag passen
   ----------------------------------------------------------------- */
function verkleinTotVierkant(file, maat){
  return new Promise((res, rej) => {
    const lezer = new FileReader();
    lezer.onerror = () => rej(new Error("lezen mislukt"));
    lezer.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("geen geldige afbeelding"));
      img.onload = () => {
        try{
          const doek = document.createElement("canvas");
          doek.width = maat; doek.height = maat;
          const c = doek.getContext("2d");
          const kant = Math.min(img.width, img.height);
          c.drawImage(img, (img.width - kant)/2, (img.height - kant)/2, kant, kant, 0, 0, maat, maat);
          res(doek.toDataURL("image/jpeg", 0.82));
        }catch(e){ rej(e); }
      };
      img.src = lezer.result;
    };
    lezer.readAsDataURL(file);
  });
}

/* -----------------------------------------------------------------
   TEAMS — wisselen per ronde, punten gaan altijd naar de persoon
   ----------------------------------------------------------------- */
function maakTeams(rondeIndex){
  const r = rondes()[rondeIndex];
  const modus = (r && r.teamModus) || "individueel";
  if(modus === "individueel"){
    return S.spelers.map(p => ({id:"s_"+p.id, naam:p.naam, suit:r.suit, leden:[p.id]}));
  }
  if(modus === "samen"){
    return [{id:"allen", naam:"Iedereen", suit:r.suit, leden:S.spelers.map(p=>p.id)}];
  }
  const aantal = Math.max(2, Math.min(r.aantalTeams || 2, Math.max(2, S.spelers.length)));
  const gehusseld = S.spelers.map(p => p.id);
  for(let i = gehusseld.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [gehusseld[i], gehusseld[j]] = [gehusseld[j], gehusseld[i]];
  }
  const teams = Array.from({length: aantal}, (_,i) => ({
    id:"t"+i, naam:TEAMNAMEN[i % TEAMNAMEN.length].naam,
    suit:TEAMNAMEN[i % TEAMNAMEN.length].suit, leden:[]
  }));
  gehusseld.forEach((pid, i) => teams[i % aantal].leden.push(pid));
  return teams;
}
function teamsVanRonde(rondeIndex){
  if(!S.teams[rondeIndex]) S.teams[rondeIndex] = maakTeams(rondeIndex);
  return S.teams[rondeIndex];
}
function verplaatsSpeler(spelerId){
  const teams = teamsVanRonde(S.r);
  if(teams.length < 2) return;
  let huidig = teams.findIndex(t => t.leden.includes(spelerId));
  if(huidig < 0) huidig = 0;
  teams[huidig].leden = teams[huidig].leden.filter(id => id !== spelerId);
  teams[(huidig + 1) % teams.length].leden.push(spelerId);
}

/* -----------------------------------------------------------------
   PUNTEN — één plek waar de stand verandert, dus altijd kloppend
   ----------------------------------------------------------------- */
function zetUitdeling(key, verdeling){
  const oud = S.uitgedeeld[key] || {};
  for(const sid in oud) S.punten[sid] = (S.punten[sid] || 0) - oud[sid];
  let leeg = true;
  for(const sid in verdeling){ S.punten[sid] = (S.punten[sid] || 0) + verdeling[sid]; leeg = false; }
  if(leeg) delete S.uitgedeeld[key]; else S.uitgedeeld[key] = verdeling;
}
function verdelingUitTeams(teamIds, puntenPerTeam){
  const teams = teamsVanRonde(S.r);
  const verdeling = {};
  teamIds.forEach(tid => {
    const t = teams.find(x => x.id === tid);
    if(!t) return;
    const p = puntenPerTeam[tid] != null ? puntenPerTeam[tid] : vraagPunten();
    t.leden.forEach(sid => { verdeling[sid] = (verdeling[sid] || 0) + p; });
  });
  return verdeling;
}
function wisselToekenning(teamId){
  momentopname();
  const key = sleutel();
  const lijst = S.toegekend[key] ? S.toegekend[key].slice() : [];
  const i = lijst.indexOf(teamId);
  if(i >= 0) lijst.splice(i,1); else lijst.push(teamId);
  S.toegekend[key] = lijst;
  zetUitdeling(key, verdelingUitTeams(lijst, {}));
  bewaar(); teken();
}
function berekenDichtstbij(){
  momentopname();
  const key = sleutel();
  const teams = teamsVanRonde(S.r);
  const doel = vraag().getal;
  const gissingen = S.gissingen[key] || {};
  const ingevuld = teams.filter(t => gissingen[t.id] != null && gissingen[t.id] !== "");
  if(!ingevuld.length){ historie.pop(); meld("Vul eerst minstens één getal in"); return; }

  let beste = Infinity;
  ingevuld.forEach(t => {
    const afstand = Math.abs(Number(gissingen[t.id]) - doel);
    if(afstand < beste) beste = afstand;
  });
  const winnaars = ingevuld.filter(t => Math.abs(Number(gissingen[t.id]) - doel) === beste);
  const puntenPerTeam = {};
  winnaars.forEach(t => { puntenPerTeam[t.id] = beste === 0 ? vraagPunten() + 2 : vraagPunten(); });

  S.toegekend[key] = winnaars.map(t => t.id);
  zetUitdeling(key, verdelingUitTeams(S.toegekend[key], puntenPerTeam));
  bewaar(); teken();
  meld(beste === 0 ? "Precies goed — bonuspunten!" : "Punten toegekend");
}

/* -----------------------------------------------------------------
   KLOK
   ----------------------------------------------------------------- */
const K = {eind:0, rest:0, loopt:false, totaal:0, raf:0, gepiept:{}};
const klokEl = $("klok"), balkEl = $("balk");

function startKlok(seconden){
  K.totaal = seconden; K.rest = seconden * 1000;
  K.eind = Date.now() + K.rest; K.loopt = true; K.gepiept = {};
  lusKlok(); tekenBesturing();
}
function stopKlok(){
  K.loopt = false;
  if(K.raf) cancelAnimationFrame(K.raf);
  K.raf = 0;
}
function pauzeerKlok(){
  // In de film is er altijd een klok: staat hij stil (na hervatten
  // bijvoorbeeld), dan zet deze knop hem weer aan het lopen.
  if(!K.totaal && S.fase === "jaaroverzicht"){ startKlok(filmSeconden()); return; }
  if(!K.totaal) return;
  if(K.loopt){ K.rest = Math.max(0, K.eind - Date.now()); stopKlok(); }
  else { K.eind = Date.now() + K.rest; K.loopt = true; lusKlok(); }
  tekenBesturing();
}
function verlengKlok(sec){
  if(!K.totaal) return;
  K.totaal += sec;
  if(K.loopt) K.eind += sec * 1000; else K.rest += sec * 1000;
  K.gepiept = {}; toonKlok(); meld("+" + sec + " seconden");
}
function lusKlok(){
  toonKlok();
  if(!K.loopt) return;
  K.raf = requestAnimationFrame(lusKlok);
}
function toonKlok(){
  if(!K.totaal){
    klokEl.textContent = "—";
    klokEl.className = "klok is-uit";
    balkEl.style.transform = "scaleX(0)";
    return;
  }
  const over = K.loopt ? Math.max(0, K.eind - Date.now()) : K.rest;
  const sec = Math.ceil(over / 1000);
  klokEl.textContent = (K.loopt || over > 0) ? sec : "0";
  klokEl.className = "klok" + (sec <= 5 ? " is-kritiek" : sec <= 10 ? " is-waarschuwing" : "");
  if(!K.loopt) klokEl.className += " is-uit";
  balkEl.className = "balk" + (sec <= 5 ? " is-kritiek" : "");
  balkEl.style.transform = "scaleX(" + Math.max(0, over / (K.totaal * 1000)) + ")";
  if(K.loopt){
    if(sec <= 3 && sec > 0 && !K.gepiept[sec]){ K.gepiept[sec] = 1; piep(660,.07); }
    if(over <= 0){
      stopKlok();
      // In het jaaroverzicht is de klok de speelduur van de dia: die telt
      // niet af naar "tijd is om", hij schuift door naar de volgende.
      if(S.fase === "jaaroverzicht"){ piep(196,.09); filmVolgende(); return; }
      piep(300,.5); meld("Tijd is om"); tekenBesturing();
    }
  }
}

/* -----------------------------------------------------------------
   GELUID — opgewekt in de browser, geen bestanden nodig
   ----------------------------------------------------------------- */
let audio = null;
function wekGeluid(){
  if(audio || !S.geluid) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audio = new AC();
  }catch(e){ audio = null; }
}
function piep(hz, duur){
  if(!S.geluid || !audio) return;
  try{
    if(audio.state === "suspended") audio.resume();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = "triangle"; osc.frequency.value = hz;
    gain.gain.setValueAtTime(0.0001, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.16, audio.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duur);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + duur + 0.02);
  }catch(e){}
}
function fanfare(){
  if(!S.geluid || !audio) return;
  [523,659,784,1047].forEach((hz,i) => setTimeout(() => piep(hz,.28), i*130));
}

function meld(tekst){
  const oud = document.querySelector(".melding");
  if(oud) oud.remove();
  clearTimeout(meldingTimer);
  const el = document.createElement("div");
  el.className = "melding"; el.textContent = tekst;
  el.setAttribute("role","status");
  $("app").appendChild(el);
  meldingTimer = setTimeout(() => el.remove(), 2800);
}

  </div>`;

function tijdTekst(sec){
  if(!isFinite(sec) || sec < 0) return "--:--";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2,"0");
}
function stopAlleMedia(){
  podium.querySelectorAll("audio,video").forEach(el => { try{ el.pause(); }catch(e){} });
}
function koppelMedia(){
  podium.querySelectorAll("audio").forEach(el => {
    const wrap = el.closest(".audiospeler");
    if(!wrap) return;
    const voortgang = wrap.querySelector(".audio-voortgang");
    const nu = wrap.querySelector(".nu");
    const totaal = wrap.querySelector(".totaal");
    const knop = wrap.querySelector(".audio-knop");
    const bij = () => {
      const d = el.duration;
      voortgang.style.width = (d ? (el.currentTime / d) * 100 : 0) + "%";
      nu.textContent = tijdTekst(el.currentTime);
      totaal.textContent = tijdTekst(d);
    };
    el.onloadedmetadata = bij;
    el.ontimeupdate = bij;
    el.onplay  = () => { knop.innerHTML = "&#10073;&#10073;"; };
    el.onpause = () => { knop.innerHTML = "&#9654;"; };
    el.onended = () => { knop.innerHTML = "&#9654;"; voortgang.style.width = "0%"; };
    el.onerror = () => { wrap.innerHTML = '<div class="media-mist"><span>Dit bestand kon niet worden afgespeeld.</span></div>'; };
    bij();
  });
}

        <span class="fijn">${nodig.length ? `${aanwezig.length} van ${nodig.length} gevraagde bestanden gevonden` : "Geen van de gekozen vragen vraagt om een bestand"}</span>
      </div>
      ${(nodig.length || MEDIA.urls.size) ? `
      <div class="medialijst">
        ${nodig.map(x => {
          const er = MEDIA.urls.has(x.bestand);
          const blob = MEDIA.blobs.get(x.bestand);
          return `<div class="mediarij${er ? "" : " is-mist"}">
            <span class="soort">${SOORTICOON[x.soort] || "📄"}</span>
            <span class="bestand">${esc(x.bestand)}</span>
            <span class="maat">${er ? maatTekst(blob ? blob.size : 0) : "ontbreekt"}</span>
            ${er
              ? `<button class="knop is-stil is-gevaar" data-actie="media-weg" data-id="${esc(x.bestand)}" aria-label="Verwijder ${esc(x.bestand)}">&times;</button>`
              : (function(){
                  const losse = Array.from(MEDIA.urls.keys()).filter(n => !nodig.some(y => y.bestand === n));
                  if(!losse.length) return `<span></span>`;
                  return `<select data-invoer="koppel" data-id="${esc(x.bestand)}" style="width:auto;padding:.28rem .45rem;font-size:.74rem" aria-label="Koppel een ingeladen bestand aan ${esc(x.bestand)}"><option value="">koppel&hellip;</option>${losse.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("")}</select>`;
                })()}
          </div>`;
        }).join("")}
        ${Array.from(MEDIA.urls.keys()).filter(n => !nodig.some(x => x.bestand === n)).map(n => {
          const blob = MEDIA.blobs.get(n);
          return `<div class="mediarij">
            <span class="soort">${SOORTICOON[soortVanBestand(n, blob && blob.type)] || "📄"}</span>
            <span class="bestand" style="color:var(--salie)">${esc(n)} — niet gekoppeld</span>
            <span class="maat">${maatTekst(blob ? blob.size : 0)}</span>
            <button class="knop is-stil is-gevaar" data-actie="media-weg" data-id="${esc(n)}" aria-label="Verwijder ${esc(n)}">&times;</button>
          </div>`;
        }).join("")}
      </div>` : ""}
    </div>

    <div class="stapel">
      <p class="opschrift is-stil">Check vooraf</p>
      <ul class="checklist">
        <li><span class="merk">&check;</span><span><strong>Werkt zonder internet.</strong> Alles zit in dit bestand. Ook als de wifi eruit ligt, loopt de quiz door.</span></li>
        <li><span class="merk${opslagWerkt ? "" : " is-let-op"}">${opslagWerkt ? "&check;" : "!"}</span><span><strong>${opslagWerkt ? "Automatisch bewaren staat aan." : "Automatisch bewaren lukt niet."}</strong> ${opslagWerkt ? "Na elke handeling wordt de stand opgeslagen." : "Je browser blokkeert opslag (privémodus?). De quiz werkt, maar herlaad de pagina niet."}</span></li>
        <li><span class="merk${metFoto === S.spelers.length ? "" : " is-let-op"}">${metFoto === S.spelers.length ? "&check;" : "!"}</span><span><strong>${metFoto} van de ${S.spelers.length} spelers heeft een portret.</strong> Portretten verschijnen bij de teams, in het klassement en op het podium.</span></li>
        <li><span class="merk${(!nodig.length || aanwezig.length === nodig.length) ? "" : " is-let-op"}">${(!nodig.length || aanwezig.length === nodig.length) ? "&check;" : "!"}</span><span><strong>${!nodig.length ? "Geen losse mediabestanden nodig." : aanwezig.length + " van de " + nodig.length + " mediabestanden ingeladen."}</strong> ${(nodig.length && aanwezig.length < nodig.length) ? "Ontbrekende bestanden tonen een nette melding; de vraag loopt gewoon door." : "Alles staat klaar."}</span></li>
        <li><span class="merk${teVullenAantal ? " is-let-op" : ""}">${teVullenAantal ? "!" : "&check;"}</span><span><strong>${teVullenAantal ? teVullenAantal + " gekozen vragen wachten nog op een antwoord." : "Alle gekozen vragen hebben een antwoord."}</strong> ${teVullenAantal ? "Dat zijn de vragen over de Blackjacks zelf en de laatste maanden van het jaar — vul ze in of vink ze uit." : "Je kunt zo beginnen."}</span></li>
        <li><span class="merk${S.geluid ? "" : " is-let-op"}">${S.geluid ? "&check;" : "!"}</span><span><strong>Geluid staat ${S.geluid ? "aan" : "uit"}.</strong> Aftelpiepjes bij de laatste drie seconden. Te wisselen in het menu.</span></li>
        <li><span class="merk is-let-op">!</span><span><strong>Op de televisie:</strong> zet je scherm op volledig scherm (<kbd>F11</kbd>, of <kbd>ctrl</kbd>+<kbd>cmd</kbd>+<kbd>F</kbd> op een Mac) en stel de tekstgrootte bij in het menu als het vanaf de bank te klein oogt.</span></li>

      <button class="knop is-hoofd is-groot" data-actie="start-film"${telling.vragen ? "" : " disabled"}>&#127902; Begin met de trailer</button>

}

/* ---- Vraagscherm ---- */
function schermVraag(){
  const r = ronde(), q = vraag();
  return `
  <div class="vlak" style="justify-content:center">
    <div class="vraagkaart" data-suit="${r.suit}">
      <p class="opschrift">Vraag ${S.v + 1} &middot; ${vraagPunten()} ${vraagPunten() === 1 ? "punt" : "punten"}</p>
      ${blokMedia(q, false)}
      ${q.emoji ? `<div class="emoji-raadsel">${q.emoji}</div>` : ""}
      ${q.lyric ? `<p class="lyric">${esc(q.lyric)}</p>` : ""}
      <p class="vraagtekst">${esc(q.v)}</p>
      ${blokKeuzes(q, r, false)}
      ${q.eenheid ? `<p class="mediabijschrift">Antwoord in ${esc(q.eenheid)}.</p>` : ""}
    </div>
  </div>`;
}

function blokKeuzes(q, r, toonGoed){
  if(r.type === "waarnietwaar"){
    const opties = ["Waar","Niet waar"];
    const goed = q.goed ? 0 : 1;
    return `<div class="keuzes">${opties.map((o,i) => `
      <div class="keuze${toonGoed && i === goed ? " is-goed" : ""}">
        <span class="keuze-letter">${String.fromCharCode(65+i)}</span><span>${o}</span>
      </div>`).join("")}</div>`;
  }
  if(r.type === "meerkeuze" && q.opties){
    return `<div class="keuzes">${q.opties.map((o,i) => `
      <div class="keuze${toonGoed && i === q.goed ? " is-goed" : ""}">
        <span class="keuze-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span>
      </div>`).join("")}</div>`;
  }
  return "";
}

/* ---- Antwoordscherm ---- */
function schermAntwoord(){
  const r = ronde(), q = vraag();
  let antwoord = q.a || "";
  if(r.type === "waarnietwaar") antwoord = q.goed ? "Waar" : "Niet waar";
  if(r.type === "meerkeuze" && q.opties) antwoord = String.fromCharCode(65 + q.goed) + " — " + q.opties[q.goed];
  if(r.type === "dichtstbij") antwoord = q.getal.toLocaleString("nl-NL") + (q.eenheid ? " " + q.eenheid : "");

  return `
  <div class="vlak">
    <div class="vraagkaart" data-suit="${r.suit}">
      <p class="opschrift">Vraag ${S.v + 1} van ${vragen().length}</p>
      ${blokMedia(q, true)}
      ${q.emoji ? `<div class="emoji-raadsel is-klein">${q.emoji}</div>` : ""}
      ${q.lyric ? `<p class="lyric is-klein">${esc(q.lyric)}</p>` : ""}
      <p class="vraagtekst is-klein">${esc(q.v)}</p>
      ${blokKeuzes(q, r, true)}
    </div>

    <div class="onthulling">
      <p class="opschrift is-stil">Het antwoord</p>
      <p class="antwoordtekst">${esc(antwoord)}</p>
      ${q.toelichting ? `<p class="toelichting">${esc(q.toelichting)}</p>` : ""}
    </div>

    ${r.type === "dichtstbij" ? blokGissingen() : blokToekennen()}
  </div>`;
}

function blokToekennen(){
  const teams = teamsVanRonde(S.r);

  const inTeams = (ronde().teamModus || "individueel") === "teams";

function blokGissingen(){

/* -----------------------------------------------------------------
   HET JAAROVERZICHT — een trailer vóór de quiz, de film erna

   De trailer laat alleen zien wat de quiz niet vraagt: regels zonder
   dubbele haken, geen maandkoppen, en van onze eigen cijfers alleen hoe
   vaak er gesport is. Na de uitslag draait de hele film, met de antwoorden
   van vanavond onderstreept. De tijdlijn staat in JAAROVERZICHT, onze eigen
   cijfers per maand in ONS_JAAR; allebei geschreven door npm run
   content:sync.
   ----------------------------------------------------------------- */
const MAANDEN_KORT = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MAANDEN_VOL = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

const onsVan = (nr) => (ONS_JAAR.maanden || {})[String(nr)] || null;
function filmIetsGedaan(o){
  return !!o && (o.sport > 0 || o.taart > 0 || (o.landen || []).length > 0);
}
/** In de trailer alleen regels zonder haken (en niet bewaard voor de film); in de film alles. */
const filmInTrailer = (x) => !x.teVullen && !x.pasNaAfloop && !/\[\[/.test(x.tekst + " " + (x.bij || ""));
const filmZichtbaar = (x) => filmOnthuld() ? !x.teVullen : filmInTrailer(x);
/** De maanden die meedoen. In de trailer: met een regel die erin mag. In de film: ook met alleen onze cijfers. */
function filmMaanden(){
  return JAAROVERZICHT.maanden
    .filter(m => filmOnthuld()
      ? m.momenten.some(filmZichtbaar) || filmIetsGedaan(onsVan(m.nr))
      : m.momenten.some(filmInTrailer))
    .map(m => m.nr);
}
const filmStappen = () => filmMaanden().length + 2;
const filmOnthuld = () => !!S.geeindigd;
function filmSeconden(){
  const nr = filmMaandNr();
  if(nr === null) return S.film === 0 ? 7 : 12;
  const m = JAAROVERZICHT.maanden.find(x => x.nr === nr);
  const regels = m.momenten.filter(filmZichtbaar).length;
  const o = onsVan(nr);
  const eigen = filmOnthuld() ? filmIetsGedaan(o) : !!o && o.sport > 0;
  return Math.min(18, Math.max(8, Math.round(5 + regels * 1.8 + (eigen ? 2 : 0))));
}
/** Het maandnummer bij de huidige dia, of null op de titel- en slotkaart. */
function filmMaandNr(){
  const lijst = filmMaanden();
  if(S.film <= 0 || S.film > lijst.length) return null;
  return lijst[S.film - 1];
}

/** Knipt een regel op de dubbele haken; wat eronder zit blijft weg tot de avond om is. */
function filmTekst(tekst, onthuld){
  let uit = "", laatste = 0;
  const patroon = /\[\[(.+?)\]\]/g;
  let m;
  while((m = patroon.exec(tekst)) !== null){
    uit += esc(tekst.slice(laatste, m.index));
    uit += `<span class="film-balk">${onthuld ? esc(m[1]) : ""}</span>`;
    laatste = m.index + m[0].length;
  }
  return uit + esc(tekst.slice(laatste));
}

function filmStrook(){
  const mee = filmMaanden(), nu = filmMaandNr(), slot = S.film >= filmStappen() - 1;
  return `<div class="film-strook" aria-hidden="true">${MAANDEN_KORT.map((naam,i) => {
    const nr = i + 1;
    const klas = "film-vak"
      + (mee.includes(nr) ? " is-mee" : "")
      + (nu === nr ? " is-nu" : "")
      + (mee.includes(nr) && (slot || (nu !== null && nr < nu)) ? " is-gehad" : "");
    return `<span class="${klas}"><i></i><em>${naam}</em></span>`;
  }).join("")}</div>`;
}

function filmEigen(nr){
  const o = onsVan(nr);
  if(!filmIetsGedaan(o) && !(o && o.bijStart)) return "";
  if(!filmOnthuld()){
    // De trailer: alleen hoe vaak er gesport is. De taarten, de landen, de
    // koploper en de stand van het jaar vragen de recap-rondes.
    if(!o.sport) return "";
    return `
    <div class="film-onsjaar">
      <p class="opschrift">Wij in ${esc(MAANDEN_VOL[nr-1])}</p>
      <div class="film-chips">
        <span class="film-chip">&#127939; <b>${o.sport}</b> keer gesport</span>
      </div>
    </div>`;
  }
  const landen = (o.landen || []).map(l =>
    `<span class="film-chip"><span style="font-size:1.2em">${esc(l.vlag)}</span>${esc(l.naam)} <small>${esc(l.wie)} &middot; ${esc(datumKort(l.datum))}</small></span>`).join("");
  const start = o.bijStart ? `<span class="film-chip is-stil">De lijst begon met ${o.bijStart} ${o.bijStart === 1 ? "land" : "landen"}</span>` : "";
  const top = o.koploper ? `<span class="film-chip is-top">${esc(o.koploper.naam)} het vaakst — <b>${o.koploper.aantal}&times;</b></span>` : "";
  return `
    <div class="film-onsjaar">
      <p class="opschrift">Wij in ${esc(MAANDEN_VOL[nr-1])}</p>
      <div class="film-chips">
        <span class="film-chip">&#127939; <b>${o.sport}</b> keer gesport</span>
        <span class="film-chip">&#127856; <b>${o.taart}</b> ${o.taart === 1 ? "taart" : "taarten"}</span>
        ${landen}${start}${top}
      </div>
      <div class="film-meeloop">
        <span>${o.totaal.sport} keer gesport</span>

function schermJaaroverzicht(){
  const onthuld = filmOnthuld();
  const nr = filmMaandNr();
  const slot = S.film >= filmStappen() - 1;
  let binnen;

  if(nr === null && !slot){
    binnen = `
      <div class="film-kaart is-titel">
        <p class="opschrift">Het jaaroverzicht</p>

        <p class="film-inleiding">${filmTekst(onthuld ? JAAROVERZICHT.inleidingNaAfloop : JAAROVERZICHT.inleiding, onthuld)}</p>
      </div>`;
  } else if(slot){
    const t = ONS_JAAR.jaartotaal;
    // Het jaar in getallen komt pas in de film: de totalen zijn vragen.
    const getallen = onthuld ? `
        <div class="telkaarten" style="max-width:720px;width:100%">
          <div class="telkaart"><span class="waarde">${t.sport}</span><span class="etiket">keer gesport</span></div>
          <div class="telkaart"><span class="waarde">${t.taart}</span><span class="etiket">taarten</span></div>
          <div class="telkaart"><span class="waarde">${t.landen}</span><span class="etiket">landen</span></div>
          <div class="telkaart"><span class="waarde">${t.dagen}</span><span class="etiket">dagen met iets erop</span></div>
        </div>
        <p class="fijn">Onze cijfers lopen tot ${esc(datumKort(ONS_JAAR.peildatum))}.</p>` : "";
    binnen = `
      <div class="film-kaart is-titel">
        <p class="opschrift">${onthuld ? "Aftiteling" : "Na de uitslag"}</p>
        <h1 class="film-jaartal is-klein">${onthuld ? "Dat was " + JAAROVERZICHT.jaar : "Straks het hele jaar"}</h1>
        <hr class="scheiding" style="max-width:520px">
        <p class="film-ondertitel">${esc(onthuld ? JAAROVERZICHT.slotNaAfloop : JAAROVERZICHT.slot)}</p>${getallen}
      </div>`;
  } else {
    const m = JAAROVERZICHT.maanden.find(x => x.nr === nr);
    const regels = m.momenten.filter(filmZichtbaar).map(mo => `
      <div class="film-regel">
        <span class="emoji">${esc(mo.emoji || "")}</span>
        <span class="tekst">${filmTekst(mo.tekst, onthuld)}${mo.bij ? `<span class="bij">${filmTekst(mo.bij, onthuld)}</span>` : ""}</span>
      </div>`).join("");
    binnen = `
      <div class="film-kaart">
        <div class="film-maandkop">
          <h1 class="film-maand">${esc(MAANDEN_VOL[nr-1])}</h1>
          <span class="film-jaarschaduw">${JAAROVERZICHT.jaar}</span>
        </div>
        ${onthuld ? `<p class="film-hoed">${esc(m.kop)}</p>` : ""}
        ${regels ? `<div class="film-regels">${regels}</div>` : ""}
        ${filmEigen(nr)}
      </div>`;
  }

  return `<div class="vlak"><div class="film${onthuld ? " is-onthuld" : ""}">${binnen}${filmStrook()}</div></div>`;
}

/* ---- Door de film heen ---- */
function naarFilm(stap){
  stopKlok();
  S.fase = "jaaroverzicht";
  S.film = Math.max(0, Math.min(stap, filmStappen() - 1));
  bewaar(); teken();
  startKlok(filmSeconden());
}
function filmVolgende(){
  if(S.film + 1 < filmStappen()){ naarFilm(S.film + 1); return; }
  stopKlok(); K.totaal = 0;
  // Na de laatste dia: de quiz in, of terug naar de uitslag bij de herhaling.
  if(filmOnthuld()){ S.fase = "einde"; bewaar(); teken(); }
  else if(S.spel && rondes().length) naarRonde(0);
  else { S.fase = "start"; bewaar(); teken(); }
}
function filmVorige(){
  if(S.film > 0){ naarFilm(S.film - 1); return; }
  stopKlok(); K.totaal = 0;
  S.fase = filmOnthuld() ? "einde" : "start";
  bewaar(); teken();
}

   ----------------------------------------------------------------- */
function naarRonde(i){
  stopKlok(); K.totaal = 0;
  S.r = Math.max(0, Math.min(i, rondes().length - 1));
  S.v = 0; S.fase = "ronde";
  teamsVanRonde(S.r);
  bewaar(); teken();
}
function startRonde(){
  if(!S.standVoorRonde[S.r]) S.standVoorRonde[S.r] = Object.assign({}, S.punten);
  S.v = 0; S.fase = "vraag";
  bewaar(); teken(); startKlok(vraagTijd());
}
function toonAntwoord(){ stopKlok(); S.fase = "antwoord"; bewaar(); teken(); }
function volgendeVraag(){
  stopKlok();
  if(S.v + 1 < vragen().length){
    S.v++; S.fase = "vraag"; bewaar(); teken(); startKlok(vraagTijd());
  } else {
    S.fase = "stand"; K.totaal = 0; bewaar(); teken();
  }
}
function terug(){
  stopKlok(); K.totaal = 0;
  if(S.fase === "vraag"){
    if(S.v > 0){ S.v--; S.fase = "antwoord"; } else { S.fase = "ronde"; }
  } else if(S.fase === "antwoord"){ S.fase = "vraag"; }
  else if(S.fase === "stand"){ S.fase = "antwoord"; S.v = vragen().length - 1; }
  else if(S.fase === "einde"){ S.fase = "stand"; S.r = rondes().length - 1; }
  else if(S.fase === "ronde"){
    if(S.r > 0){ S.r--; S.v = vragen().length - 1; S.fase = "stand"; }
    else { S.fase = "start"; }
  }
  bewaar(); teken();
}
function naarEinde(){
  stopKlok(); K.totaal = 0;
  // Vanaf hier is alles gevraagd: het jaaroverzicht mag zijn balken laten vallen.
  S.geeindigd = true;
  S.fase = "einde"; bewaar(); teken();
  fanfare(); vierFeest();
}

  regels.push("BLACKJACKS KWIS — " + (S.spel ? S.spel.naam : PAKKETTEN[S.pakket].naam));
  regels.push(new Date().toLocaleString("nl-NL"));
  regels.push("Quizmaster: " + (S.quizmaster || "—"));
  regels.push("");
  regels.push("EINDSTAND");
  lijst.forEach((p,i) => regels.push((i+1) + ". " + p.naam + " — " + p.punten + " punten"));
  regels.push("");

/* -----------------------------------------------------------------
   CONFETTI
   ----------------------------------------------------------------- */
const doek = $("confetti");
const ctx = doek.getContext ? doek.getContext("2d") : null;
let snippers = [], feestRaf = 0;

function pasDoekAan(){
  if(!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  doek.width = doek.clientWidth * dpr;
  doek.height = doek.clientHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function vierFeest(){
  if(!ctx) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  pasDoekAan();
  const kleuren = ["#C9A227","#EBD27C","#F5F0E4","#C0452F","#4E9A6B"];
  snippers = Array.from({length: 170}, () => ({
    x: Math.random() * doek.clientWidth,
    y: -20 - Math.random() * doek.clientHeight * .6,
    b: 5 + Math.random() * 7, h: 9 + Math.random() * 11,
    vy: 1.8 + Math.random() * 2.8, vx: -1 + Math.random() * 2,
    hoek: Math.random() * Math.PI, draai: -.08 + Math.random() * .16,
    kleur: kleuren[Math.floor(Math.random() * kleuren.length)]
  }));
  if(feestRaf) cancelAnimationFrame(feestRaf);
  lusFeest();
}
function lusFeest(){
  if(!ctx) return;
  ctx.clearRect(0,0,doek.clientWidth,doek.clientHeight);
  let levend = false;
  snippers.forEach(s => {
    s.y += s.vy; s.x += s.vx; s.hoek += s.draai;
    if(s.y < doek.clientHeight + 30) levend = true;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.hoek);
    ctx.fillStyle = s.kleur;
    ctx.fillRect(-s.b/2, -s.h/2, s.b, s.h);
    ctx.restore();
  });
  if(levend) feestRaf = requestAnimationFrame(lusFeest);
  else ctx.clearRect(0,0,doek.clientWidth,doek.clientHeight);
}
window.addEventListener("resize", pasDoekAan);

    const ta = $("uitslag-tekst");
    if(!ta) return;
    ta.select(); ta.setSelectionRange(0, 99999);
    const klaar = () => meld("Uitslag gekopieerd");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(klaar).catch(() => meld("Kopiëren lukte niet — selecteer de tekst zelf"));
    } else {
      try{ document.execCommand("copy"); klaar(); }catch(e){ meld("Selecteer de tekst zelf en kopieer"); }
    }
  },
  "download": async () => {
    if(!downloadsCap) return;
    try{
      await downloadsCap.save({filename:"blackjacks-kwis-uitslag.txt", data: bouwUitslag()});
      meld("Bestand aangeboden");
    }catch(e){ meld("Opslaan lukte niet — gebruik Kopieer"); }
  },
  "opnieuw": () => {
    if(!confirm("Weet je het zeker? De hele stand wordt gewist. Spelers, portretten en media blijven bewaard.")) return;
    sluitPaneel(); wisOpslag();
    const bewaard = {
      spelers:S.spelers, quizmaster:S.quizmaster, selectie:S.selectie,
      geluid:S.geluid, schaal:S.schaal, pakket:S.pakket
    };
    S = Object.assign(LEEG(), bewaard);
    historie = []; stopKlok(); K.totaal = 0;
    bewaar(); teken();
  }
};

/* -----------------------------------------------------------------
   GEBEURTENISSEN
   ----------------------------------------------------------------- */
let laatsteKlikX = 0;
$("app").addEventListener("click", (e) => {
  laatsteKlikX = e.clientX;
  const doel = e.target.closest("[data-actie]");
  if(!doel) return;
  const fn = ACTIES[doel.dataset.actie];
  if(fn) fn(doel.dataset.id, doel);
});

$("app").addEventListener("input", (e) => {
  const doel = e.target.closest("[data-invoer]");
  if(!doel) return;
  const soort = doel.dataset.invoer;
  if(soort === "spelernaam"){
    const p = speler(doel.dataset.id);
    if(p){ p.naam = doel.value; bewaar(); }
  } else if(soort === "quizmaster"){
    S.quizmaster = doel.value; bewaar();
  } else if(soort === "gissing"){
    const key = sleutel();
    if(!S.gissingen[key]) S.gissingen[key] = {};
    S.gissingen[key][doel.dataset.id] = doel.value;
    bewaar();
  }
});

$("app").addEventListener("change", (e) => {
  const doel = e.target.closest("[data-invoer='koppel']");
  if(!doel || !doel.value) return;
  const blob = MEDIA.blobs.get(doel.value);
  if(!blob) return;
  mediaBewaar(doel.dataset.id, blob).then(() => { teken(); meld("Bestand gekoppeld"); });
});

$("fotoKiezer").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file || !fotoDoelSpeler) return;
  try{
    const data = await verkleinTotVierkant(file, 256);
    const sp = speler(fotoDoelSpeler);
    if(sp){ sp.foto = data; bewaar(); teken(); meld("Portret ingesteld"); }
  }catch(err){ meld("Die afbeelding kon niet worden gelezen"); }
  fotoDoelSpeler = null;
});

$("mediaKiezer").addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  let gelukt = 0;
  for(const f of files){
    try{ await mediaBewaar(f.name, f); gelukt++; }catch(err){}
  }
  teken();
  meld(gelukt + (gelukt === 1 ? " bestand ingeladen" : " bestanden ingeladen") + (MEDIA.db ? "" : " — niet bewaard na herladen"));
});

document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  if(e.key === "Escape"){ sluitPaneel(); return; }
  if(document.querySelector(".paneel-achtergrond")) return;
  if(e.key === " " || e.key === "Enter"){
    e.preventDefault();
    if(S.fase === "start") ACTIES["start-film"]();
    else if(S.fase === "jaaroverzicht") filmVolgende();
    else if(S.fase === "ronde") startRonde();
    else if(S.fase === "vraag") toonAntwoord();
    else if(S.fase === "antwoord") volgendeVraag();
    else if(S.fase === "stand"){ S.r + 1 < rondes().length ? naarRonde(S.r + 1) : naarEinde(); }
  }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); if(S.fase === "jaaroverzicht") filmVorige(); else if(S.fase !== "start") terug(); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); if(S.fase === "jaaroverzicht") filmVolgende(); else if(S.fase === "vraag") toonAntwoord(); else if(S.fase === "antwoord") volgendeVraag(); }
  else if(e.key === "p" || e.key === "P"){ if(S.fase === "vraag" || S.fase === "jaaroverzicht") pauzeerKlok(); }
  else if(e.key === "t" || e.key === "T"){ if(S.fase === "vraag") verlengKlok(30); }
  else if(e.key === "m" || e.key === "M"){ speelPauzeerMedia(null); }
  else if(e.key === "z" || e.key === "Z"){ herstel(); }
});

/* -----------------------------------------------------------------
   OPSTARTEN
   ----------------------------------------------------------------- */
(function(){
  const d = laadOpgeslagen();
  if(d && d.fase === "start") S = Object.assign(LEEG(), d);
  pasDoekAan();
  teken();

  mediaLaadAlles().then(() => { if(S.fase === "start") teken(); });

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads")
      .then(cap => { downloadsCap = cap || null; })
      .catch(() => { downloadsCap = null; });
  }
})();
</script>
