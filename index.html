<title>Blackjacks Kwis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ---------------------------------------------------------------
   Blackjacks Kwis — een kaarttafel om middernacht.
   Bewust één visuele wereld (donker vilt): dit is een presentatie-
   scherm voor een donkere kamer. Alle kleuren expliciet gezet.
   --------------------------------------------------------------- */
:root{
  --inkt:#08130F;
  --vilt:#0D1E18;
  --vilt-hoog:#142C23;
  --vilt-diep:#0A1813;
  --rand:#23453A;
  --rand-zacht:#1A3229;
  --ivoor:#F5F0E4;
  --ivoor-zacht:#D8D2C2;
  --salie:#8AA096;
  --salie-diep:#5E736A;
  --goud:#C9A227;
  --goud-licht:#EBD27C;
  --goud-diep:#8A6E14;
  --rood:#C0452F;
  --rood-licht:#E4705A;
  --groen:#4E9A6B;
  --groen-licht:#78C495;

  --sp-1:.35rem; --sp-2:.65rem; --sp-3:1rem; --sp-4:1.5rem;
  --sp-5:2.25rem; --sp-6:3.25rem;
  --radius:14px;
  --rail-h:clamp(56px,9vh,76px);

  --display:"Bodoni Moda",Georgia,"Times New Roman",serif;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono","SFMono-Regular",Consolas,monospace;

  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--vilt);
  color:var(--ivoor);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--goud-licht);outline-offset:3px;border-radius:6px}

/* ---- Tafel ---------------------------------------------------- */
#app{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(120% 90% at 50% 0%, #17362B 0%, var(--vilt) 42%, var(--vilt-diep) 100%);
}
#confetti{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:40;
}

/* ---- Bovenrail ------------------------------------------------- */
.rail{
  flex:0 0 auto;
  display:flex;align-items:center;gap:var(--sp-3);
  padding:0 clamp(16px,3vw,32px);
  min-height:var(--rail-h);
  padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,rgba(8,19,15,.92),rgba(8,19,15,.55));
  border-bottom:1px solid var(--rand-zacht);
  position:relative;z-index:20;
}
.rail-suit{
  font-size:clamp(1.3rem,2.6vw,1.9rem);
  color:var(--goud);
  line-height:1;
}
.rail-suit.is-rood{color:var(--rood-licht)}
.rail-info{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.rail-ronde{
  font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--salie);font-weight:600;
}
.rail-naam{
  font-family:var(--display);
  font-size:clamp(.98rem,2.3vw,1.4rem);
  line-height:1.15;
  color:var(--ivoor);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rail-teller{
  font-family:var(--mono);font-size:.82rem;color:var(--salie);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.klok{
  font-family:var(--mono);
  font-size:clamp(1.6rem,4.4vw,2.6rem);
  font-weight:500;
  font-variant-numeric:tabular-nums;
  color:var(--goud-licht);
  line-height:1;min-width:2.6ch;text-align:right;
}
.klok.is-waarschuwing{color:var(--goud)}
.klok.is-kritiek{color:var(--rood-licht);animation:pols .9s ease-in-out infinite}
.klok.is-uit{color:var(--salie-diep)}
@keyframes pols{50%{opacity:.45}}
.balk{
  position:absolute;left:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--goud-diep),var(--goud-licht));
  width:100%;transform-origin:left center;z-index:21;
}
.balk.is-kritiek{background:linear-gradient(90deg,#7A2418,var(--rood-licht))}

/* ---- Speelvlak ------------------------------------------------- */
#podium{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
  padding:clamp(16px,3vw,32px);
  padding-block:clamp(18px,3.5vh,40px);
}
.vlak{
  width:100%;max-width:min(1100px,100%);
  margin:0 auto;
  display:flex;flex-direction:column;
  gap:var(--sp-4);
  flex:1 1 auto;
  animation:opkomen .32s cubic-bezier(.2,.7,.3,1) both;
}
.vlak.is-gecentreerd{justify-content:center;text-align:center;align-items:center}
@keyframes opkomen{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .vlak{animation:none}
  .klok.is-kritiek{animation:none}
}

/* ---- Typografie ------------------------------------------------ */
.opschrift{
  font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--goud);font-weight:600;margin:0;
}
.opschrift.is-stil{color:var(--salie)}
h1.titel{
  font-family:var(--display);
  font-size:clamp(2.4rem,8vw,5rem);
  font-weight:700;line-height:.98;margin:0;
  text-wrap:balance;color:var(--ivoor);
}
h2.kop{
  font-family:var(--display);
  font-size:clamp(1.7rem,5vw,3rem);
  font-weight:600;line-height:1.05;margin:0;
  text-wrap:balance;color:var(--ivoor);
}
h3.subkop{
  font-family:var(--ui);font-size:.95rem;font-weight:600;
  letter-spacing:.02em;margin:0;color:var(--ivoor-zacht);
}
p.lood{
  margin:0;color:var(--ivoor-zacht);
  font-size:clamp(.95rem,1.5vw,1.08rem);
  max-width:62ch;text-wrap:pretty;
}
p.fijn{margin:0;color:var(--salie);font-size:.85rem;max-width:64ch}
.hint{
  font-family:var(--display);font-style:italic;
  color:var(--goud-light,var(--goud-licht));
  font-size:clamp(.95rem,2vw,1.15rem);
}

/* ---- De vraag (het enige kaartobject op de pagina) -------------- */
.vraagkaart{
  background:linear-gradient(170deg,#FBF8EF,#EDE6D4);
  color:#14201B;
  border-radius:var(--radius);
  padding:clamp(20px,4vw,44px);
  box-shadow:0 22px 50px -18px rgba(0,0,0,.75), 0 0 0 1px rgba(201,162,39,.35);
  display:flex;flex-direction:column;gap:var(--sp-3);
  position:relative;
}
.vraagkaart::after{
  content:attr(data-suit);
  position:absolute;right:clamp(14px,2.5vw,22px);bottom:clamp(8px,2vw,14px);
  font-size:clamp(2rem,6vw,3.4rem);color:rgba(20,32,27,.07);
  line-height:1;pointer-events:none;
}
.vraagtekst{
  font-family:var(--display);
  font-size:clamp(1.35rem,4.2vw,2.5rem);
  font-weight:600;line-height:1.16;margin:0;
  text-wrap:balance;color:#14201B;
}
.emoji-raadsel{
  font-size:clamp(2.6rem,11vw,5.5rem);
  line-height:1.25;letter-spacing:.08em;
  text-align:center;margin:var(--sp-2) 0;
  word-break:break-word;
}
.lyric{
  font-family:var(--display);font-style:italic;
  font-size:clamp(1.4rem,4.6vw,2.6rem);
  line-height:1.25;color:#14201B;margin:0;text-wrap:balance;
}
.lyric::before{content:"\201C"}
.lyric::after{content:"\201D"}

/* ---- Keuzes ---------------------------------------------------- */
.keuzes{
  display:grid;gap:var(--sp-2);
  grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));
}
.keuze{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:clamp(12px,2vw,18px) clamp(14px,2.2vw,20px);
  background:rgba(20,32,27,.055);
  border:1px solid rgba(20,32,27,.14);
  border-radius:10px;
  font-size:clamp(1rem,2.2vw,1.25rem);
  color:#14201B;text-align:left;
}
.keuze-letter{
  font-family:var(--mono);font-size:.95rem;font-weight:500;
  width:1.9rem;height:1.9rem;flex:0 0 auto;
  display:grid;place-items:center;border-radius:50%;
  background:#14201B;color:var(--ivoor);
}
.keuze.is-goed{
  background:rgba(78,154,107,.18);
  border-color:var(--groen);
  box-shadow:inset 0 0 0 1px var(--groen);
}
.keuze.is-goed .keuze-letter{background:var(--groen)}

/* ---- Antwoordonthulling ---------------------------------------- */
.onthulling{
  background:var(--vilt-hoog);
  border:1px solid var(--rand);
  border-left:3px solid var(--groen);
  border-radius:var(--radius);
  padding:clamp(16px,3vw,28px);
  display:flex;flex-direction:column;gap:var(--sp-2);
}
.antwoordtekst{
  font-family:var(--display);
  font-size:clamp(1.5rem,5vw,2.8rem);
  font-weight:600;line-height:1.1;margin:0;
  color:var(--groen-licht);text-wrap:balance;
}
.toelichting{margin:0;color:var(--ivoor-zacht);font-size:.95rem;max-width:66ch}

/* ---- Puntentoekenning ------------------------------------------ */
.toekennen{display:flex;flex-direction:column;gap:var(--sp-2)}
.toekennen-rij{
  display:grid;gap:var(--sp-2);
  grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));
}
.punt-knop{
  display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-3);
  background:var(--vilt-hoog);
  border:1px solid var(--rand);
  border-radius:10px;
  color:var(--ivoor-zacht);
  cursor:pointer;text-align:left;
  transition:background .15s,border-color .15s,color .15s;
  font-size:.95rem;
}
.punt-knop:hover{border-color:var(--salie-diep);background:#193527}
.punt-knop.is-toegekend{
  background:rgba(78,154,107,.16);
  border-color:var(--groen);
  color:var(--ivoor);
}
.punt-vink{
  width:1.55rem;height:1.55rem;flex:0 0 auto;
  border-radius:50%;border:1.5px solid var(--salie-diep);
  display:grid;place-items:center;font-size:.85rem;color:transparent;
}
.punt-knop.is-toegekend .punt-vink{
  background:var(--groen);border-color:var(--groen);color:#08130F;
}
.punt-naam{flex:1 1 auto;min-width:0}
.punt-leden{display:block;font-size:.72rem;color:var(--salie);margin-top:1px}

/* ---- Teams / spelers ------------------------------------------- */
.teamgrid{
  display:grid;gap:var(--sp-3);
  grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));
}
.teamkaart{
  background:var(--vilt-hoog);
  border:1px solid var(--rand);
  border-radius:var(--radius);
  padding:var(--sp-3);
  display:flex;flex-direction:column;gap:var(--sp-2);
}
.teamkaart-kop{
  display:flex;align-items:center;gap:var(--sp-2);
  font-family:var(--display);font-size:1.15rem;font-weight:600;
  color:var(--goud-licht);
}
.teamkaart-kop .suit{font-size:1.25rem}
.teamkaart-kop .suit.is-rood{color:var(--rood-licht)}
.chiprij{display:flex;flex-wrap:wrap;gap:var(--sp-1)}
.chip{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.38rem .7rem;border-radius:999px;
  background:var(--vilt-diep);border:1px solid var(--rand);
  color:var(--ivoor-zacht);font-size:.85rem;
  cursor:pointer;transition:border-color .15s,color .15s;
}
.chip:hover{border-color:var(--goud-diep);color:var(--ivoor)}
.chip.is-vast{cursor:default}
.chip.is-vast:hover{border-color:var(--rand);color:var(--ivoor-zacht)}

/* ---- Klassement ------------------------------------------------ */
.klassement{display:flex;flex-direction:column;gap:2px;width:100%}
.klassement-rij{
  display:grid;
  grid-template-columns:2.2rem 1fr auto;
  align-items:center;gap:var(--sp-3);
  padding:clamp(10px,1.8vh,16px) var(--sp-3);
  border-bottom:1px solid var(--rand-zacht);
  transition:background .2s;
}
.klassement-rij:first-child{
  background:linear-gradient(90deg,rgba(201,162,39,.14),transparent 70%);
  border-bottom-color:var(--goud-diep);
}
.klassement-plek{
  font-family:var(--mono);font-size:.95rem;color:var(--salie);
  font-variant-numeric:tabular-nums;
}
.klassement-rij:first-child .klassement-plek{color:var(--goud)}
.klassement-naam{
  font-family:var(--display);
  font-size:clamp(1.1rem,3vw,1.7rem);
  font-weight:600;color:var(--ivoor);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.klassement-punten{
  font-family:var(--mono);
  font-size:clamp(1.05rem,2.8vw,1.6rem);
  color:var(--goud-licht);font-variant-numeric:tabular-nums;
}
.klassement-delta{
  font-family:var(--mono);font-size:.78rem;color:var(--groen-licht);
  margin-left:.4rem;
}

/* ---- Podium ---------------------------------------------------- */
.podiumrij{
  display:grid;gap:var(--sp-3);
  grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));
  width:100%;align-items:end;
}
.podiumplek{
  background:var(--vilt-hoog);border:1px solid var(--rand);
  border-radius:var(--radius);padding:var(--sp-4) var(--sp-3);
  display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);
}
.podiumplek.is-eerste{
  background:linear-gradient(180deg,rgba(201,162,39,.2),var(--vilt-hoog));
  border-color:var(--goud);
  box-shadow:0 0 44px -14px rgba(201,162,39,.6);
}
.podium-medaille{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1}
.podium-naam{
  font-family:var(--display);font-size:clamp(1.2rem,3.4vw,1.9rem);
  font-weight:600;color:var(--ivoor);text-align:center;
}
.podium-punten{font-family:var(--mono);color:var(--goud-licht);font-size:1.05rem}

/* ---- Formulieren ----------------------------------------------- */
.veld{display:flex;flex-direction:column;gap:var(--sp-1)}
.veld-label{
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--salie);font-weight:600;
}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:.7rem .85rem;
  background:var(--vilt-diep);
  border:1px solid var(--rand);
  border-radius:8px;color:var(--ivoor);
  font-family:var(--ui);font-size:1rem;
}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{font-family:var(--mono);font-size:.8rem;line-height:1.5;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--salie-diep)}
input:focus,textarea:focus,select:focus{border-color:var(--goud-diep);outline:none}

.spelerlijst{display:flex;flex-direction:column;gap:var(--sp-2)}
.spelerrij{display:flex;align-items:center;gap:var(--sp-2)}
.spelerrij .volgnr{
  font-family:var(--mono);font-size:.8rem;color:var(--salie-diep);
  width:1.5rem;flex:0 0 auto;text-align:right;
}

/* ---- Knoppen --------------------------------------------------- */
.knop{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.72rem 1.25rem;border-radius:9px;
  border:1px solid var(--rand);
  background:var(--vilt-hoog);color:var(--ivoor-zacht);
  font-size:.9rem;font-weight:500;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s,transform .08s;
  white-space:nowrap;
}
.knop:hover{background:#1B3A2C;border-color:var(--salie-diep);color:var(--ivoor)}
.knop:active{transform:translateY(1px)}
.knop[disabled]{opacity:.35;cursor:not-allowed}
.knop.is-hoofd{
  background:linear-gradient(180deg,var(--goud-licht),var(--goud));
  border-color:var(--goud-licht);color:#1A1405;font-weight:700;
  box-shadow:0 8px 24px -10px rgba(201,162,39,.8);
}
.knop.is-hoofd:hover{background:linear-gradient(180deg,#F4DE95,var(--goud-licht));color:#1A1405}
.knop.is-groot{padding:.95rem 1.9rem;font-size:1.02rem}
.knop.is-stil{background:transparent;border-color:transparent;color:var(--salie)}
.knop.is-stil:hover{background:var(--vilt-hoog);color:var(--ivoor)}
.knop.is-gevaar:hover{border-color:var(--rood);color:var(--rood-licht);background:rgba(192,69,47,.12)}
.knoprij{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}

/* ---- Onderbalk (quizmasterbediening) --------------------------- */
.besturing{
  flex:0 0 auto;
  display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) clamp(12px,3vw,24px);
  padding-bottom:calc(var(--sp-2) + env(safe-area-inset-bottom,0px));
  background:rgba(8,19,15,.94);
  border-top:1px solid var(--rand-zacht);
  overflow-x:auto;scrollbar-width:thin;
  position:relative;z-index:20;
}
.besturing::-webkit-scrollbar{height:4px}
.besturing::-webkit-scrollbar-thumb{background:var(--rand);border-radius:2px}
.besturing .rek{flex:1 1 auto;min-width:var(--sp-1)}

/* ---- Paneel (overlay) ------------------------------------------ */
.paneel-achtergrond{
  position:absolute;inset:0;z-index:50;
  background:rgba(4,10,8,.78);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(12px,3vw,28px);
}
.paneel{
  background:var(--vilt);
  border:1px solid var(--rand);
  border-radius:var(--radius);
  width:min(620px,100%);
  max-height:min(86vh,720px);
  overflow-y:auto;
  padding:clamp(18px,3.5vw,32px);
  display:flex;flex-direction:column;gap:var(--sp-3);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.9);
}
.paneel-kop{display:flex;align-items:flex-start;gap:var(--sp-3)}
.paneel-kop h2{
  font-family:var(--display);font-size:1.5rem;font-weight:600;
  margin:0;flex:1 1 auto;color:var(--ivoor);
}

/* ---- Checklist ------------------------------------------------- */
.checklist{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.checklist li{
  display:flex;gap:var(--sp-2);align-items:flex-start;
  padding:.55rem 0;border-bottom:1px solid var(--rand-zacht);
  font-size:.9rem;color:var(--ivoor-zacht);
}
.checklist li:last-child{border-bottom:none}
.checklist .merk{color:var(--groen-licht);flex:0 0 auto;font-size:.95rem;line-height:1.5}
.checklist .merk.is-let-op{color:var(--goud)}

/* ---- Overzicht rondes ------------------------------------------ */
.rondelijst{display:flex;flex-direction:column;gap:2px}
.ronderij{
  display:grid;grid-template-columns:1.6rem 1fr auto;
  align-items:center;gap:var(--sp-3);
  padding:.6rem 0;border-bottom:1px solid var(--rand-zacht);
  font-size:.9rem;text-align:left;width:100%;
  background:none;border-left:none;border-right:none;border-top:none;
  color:var(--ivoor-zacht);cursor:pointer;
}
.ronderij:hover{color:var(--ivoor)}
.ronderij .suit{font-size:1.1rem;color:var(--goud)}
.ronderij .suit.is-rood{color:var(--rood-licht)}
.ronderij .meta{
  font-family:var(--mono);font-size:.75rem;color:var(--salie);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* ---- Pakketkeuze ----------------------------------------------- */
.pakketkeuze{display:grid;gap:var(--sp-2);grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.pakketknop{
  text-align:left;padding:var(--sp-3);
  background:var(--vilt-hoog);border:1px solid var(--rand);
  border-radius:var(--radius);cursor:pointer;color:var(--ivoor-zacht);
  display:flex;flex-direction:column;gap:.3rem;
  transition:border-color .15s,background .15s;
}
.pakketknop:hover{border-color:var(--salie-diep)}
.pakketknop.is-actief{
  border-color:var(--goud);
  background:linear-gradient(180deg,rgba(201,162,39,.13),var(--vilt-hoog));
  color:var(--ivoor);
}
.pakketknop .naam{font-family:var(--display);font-size:1.2rem;font-weight:600;color:var(--ivoor)}
.pakketknop .beschrijving{font-size:.82rem;color:var(--salie);line-height:1.45}
.pakketknop .cijfers{font-family:var(--mono);font-size:.74rem;color:var(--goud-diep);letter-spacing:.04em}
.pakketknop.is-actief .cijfers{color:var(--goud)}

/* ---- Meldingen -------------------------------------------------- */
.melding{
  position:absolute;left:50%;bottom:calc(var(--sp-4) + env(safe-area-inset-bottom,0px));

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function bewaar(){
  try{ localStorage.setItem(OPSLAGSLEUTEL, JSON.stringify(S)); }catch(e){ /* privémodus: quiz loopt gewoon door */ }
}
function laadOpgeslagen(){
  try{
    const ruw = localStorage.getItem(OPSLAGSLEUTEL);
    if(!ruw) return null;
    const d = JSON.parse(ruw);
    if(!d || !d.spelers || !PAKKETTEN[d.pakket]) return null;
    return d;
  }catch(e){ return null; }
}
function wisOpslag(){ try{ localStorage.removeItem(OPSLAGSLEUTEL); }catch(e){} }

function momentopname(){
  historie.push(JSON.stringify({
    fase:S.fase, r:S.r, v:S.v,
    punten:S.punten, toegekend:S.toegekend,
    uitgedeeld:S.uitgedeeld, gissingen:S.gissingen, teams:S.teams
  }));
  if(historie.length > 50) historie.shift();
}
function herstel(){
  const laatste = historie.pop();
  if(!laatste){ meld("Niets om terug te draaien"); return; }
  Object.assign(S, JSON.parse(laatste));
  stopKlok();
  bewaar(); teken();
  meld("Laatste actie teruggedraaid");
}

const vraagTijd = () => (vraag() && vraag().tijd) || ronde().tijd || 30;
const vraagPunten = () => (vraag() && vraag().punten) || ronde().punten || 1;
const totaalVragen = () => rondes().reduce((n,r) => n + r.vragen.length, 0);

function klassement(){
  return S.spelers
    .map(p => ({...p, punten: S.punten[p.id] || 0}))
    .sort((a,b) => b.punten - a.punten || a.naam.localeCompare(b.naam,"nl"));
}

/* -----------------------------------------------------------------
   TEAMS — wisselen per ronde, punten gaan altijd naar de persoon
   ----------------------------------------------------------------- */
function maakTeams(rondeIndex){
  const r = rondes()[rondeIndex];
  const modus = r.teamModus || "individueel";
  if(modus === "individueel"){
    return S.spelers.map(p => ({id:"s_"+p.id, naam:p.naam, suit:r.suit, leden:[p.id]}));
  }
  if(modus === "samen"){
    return [{id:"allen", naam:"Iedereen", suit:r.suit, leden:S.spelers.map(p=>p.id)}];
  }
  const aantal = Math.max(2, Math.min(r.aantalTeams || 2, Math.max(2, S.spelers.length)));
  const gehusseld = S.spelers.map(p=>p.id);
  for(let i = gehusseld.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [gehusseld[i], gehusseld[j]] = [gehusseld[j], gehusseld[i]];
  }
  const teams = Array.from({length: aantal}, (_,i) => ({
    id: "t" + i,
    naam: TEAMNAMEN[i % TEAMNAMEN.length].naam,
    suit: TEAMNAMEN[i % TEAMNAMEN.length].suit,
    leden: []
  }));
  gehusseld.forEach((pid, i) => teams[i % aantal].leden.push(pid));
  return teams;
}
function teamsVanRonde(rondeIndex){
  if(!S.teams[rondeIndex]) S.teams[rondeIndex] = maakTeams(rondeIndex);
  return S.teams[rondeIndex];
}
function verplaatsSpeler(spelerId){
  const teams = teamsVanRonde(S.r);
  if(teams.length < 2) return;
  let huidig = teams.findIndex(t => t.leden.includes(spelerId));
  if(huidig < 0) huidig = 0;
  teams[huidig].leden = teams[huidig].leden.filter(id => id !== spelerId);
  teams[(huidig + 1) % teams.length].leden.push(spelerId);
}

/* -----------------------------------------------------------------
   PUNTEN — één plek waar de stand verandert, dus altijd kloppend
   ----------------------------------------------------------------- */
function zetUitdeling(key, verdeling){
  const oud = S.uitgedeeld[key] || {};
  for(const sid in oud) S.punten[sid] = (S.punten[sid] || 0) - oud[sid];
  let leeg = true;
  for(const sid in verdeling){
    S.punten[sid] = (S.punten[sid] || 0) + verdeling[sid];
    leeg = false;
  }
  if(leeg) delete S.uitgedeeld[key]; else S.uitgedeeld[key] = verdeling;
}
function verdelingUitTeams(teamIds, puntenPerTeam){
  const teams = teamsVanRonde(S.r);
  const verdeling = {};
  teamIds.forEach(tid => {
    const t = teams.find(x => x.id === tid);
    if(!t) return;
    const p = puntenPerTeam[tid] != null ? puntenPerTeam[tid] : vraagPunten();
    t.leden.forEach(sid => { verdeling[sid] = (verdeling[sid] || 0) + p; });
  });
  return verdeling;
}
function wisselToekenning(teamId){
  momentopname();
  const key = sleutel();
  const lijst = S.toegekend[key] ? S.toegekend[key].slice() : [];
  const i = lijst.indexOf(teamId);
  if(i >= 0) lijst.splice(i,1); else lijst.push(teamId);
  S.toegekend[key] = lijst;
  zetUitdeling(key, verdelingUitTeams(lijst, {}));
  bewaar(); teken();
}
function berekenDichtstbij(){
  momentopname();
  const key = sleutel();
  const teams = teamsVanRonde(S.r);
  const doel = vraag().getal;
  const gissingen = S.gissingen[key] || {};
  const ingevuld = teams.filter(t => gissingen[t.id] != null && gissingen[t.id] !== "");
  if(!ingevuld.length){ meld("Vul eerst minstens één getal in"); historie.pop(); return; }

  let besteAfstand = Infinity;
  ingevuld.forEach(t => {
    const afstand = Math.abs(Number(gissingen[t.id]) - doel);
    if(afstand < besteAfstand) besteAfstand = afstand;
  });
  const winnaars = ingevuld.filter(t => Math.abs(Number(gissingen[t.id]) - doel) === besteAfstand);
  const puntenPerTeam = {};
  winnaars.forEach(t => { puntenPerTeam[t.id] = besteAfstand === 0 ? vraagPunten() + 2 : vraagPunten(); });

  S.toegekend[key] = winnaars.map(t => t.id);
  zetUitdeling(key, verdelingUitTeams(S.toegekend[key], puntenPerTeam));
  bewaar(); teken();
  meld(besteAfstand === 0 ? "Precies goed — bonuspunten!" : "Punten toegekend");
}

/* -----------------------------------------------------------------
   KLOK
   ----------------------------------------------------------------- */
const K = {eind:0, rest:0, loopt:false, totaal:0, raf:0, gepiept:{}};
const klokEl = $("klok"), balkEl = $("balk");

function startKlok(seconden){
  K.totaal = seconden; K.rest = seconden * 1000;
  K.eind = Date.now() + K.rest; K.loopt = true; K.gepiept = {};
  lusKlok();
  tekenBesturing();
}
function stopKlok(){
  K.loopt = false;
  if(K.raf) cancelAnimationFrame(K.raf);
  K.raf = 0;
}
function pauzeerKlok(){
  if(!K.totaal) return;
  if(K.loopt){ K.rest = Math.max(0, K.eind - Date.now()); stopKlok(); }
  else { K.eind = Date.now() + K.rest; K.loopt = true; lusKlok(); }
  tekenBesturing();
}
function verlengKlok(sec){
  if(!K.totaal) return;
  K.totaal += sec;
  if(K.loopt) K.eind += sec * 1000; else K.rest += sec * 1000;
  K.gepiept = {};
  toonKlok();
  meld("+" + sec + " seconden");
}
function lusKlok(){
  toonKlok();
  if(!K.loopt) return;
  K.raf = requestAnimationFrame(lusKlok);
}
function toonKlok(){
  if(!K.totaal){
    klokEl.textContent = "—";
    klokEl.className = "klok is-uit";
    balkEl.style.transform = "scaleX(0)";
    return;
  }
  const over = K.loopt ? Math.max(0, K.eind - Date.now()) : K.rest;
  const sec = Math.ceil(over / 1000);
  klokEl.textContent = K.loopt || over > 0 ? sec : "0";
  klokEl.className = "klok" + (sec <= 5 ? " is-kritiek" : sec <= 10 ? " is-waarschuwing" : "");
  if(!K.loopt) klokEl.className += " is-uit";
  balkEl.className = "balk" + (sec <= 5 ? " is-kritiek" : "");
  balkEl.style.transform = "scaleX(" + Math.max(0, over / (K.totaal * 1000)) + ")";

  if(K.loopt){
    if(sec <= 3 && sec > 0 && !K.gepiept[sec]){ K.gepiept[sec] = 1; piep(660, .07); }
    if(over <= 0){ stopKlok(); piep(300, .5); meld("Tijd is om"); tekenBesturing(); }
  }
}

/* -----------------------------------------------------------------
   GELUID — opgewekt in de browser, geen bestanden nodig
   ----------------------------------------------------------------- */
let audio = null;
function wekGeluid(){
  if(audio || !S.geluid) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audio = new AC();
  }catch(e){ audio = null; }
}
function piep(hz, duur){
  if(!S.geluid || !audio) return;
  try{
    if(audio.state === "suspended") audio.resume();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = "triangle"; osc.frequency.value = hz;
    gain.gain.setValueAtTime(0.0001, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.16, audio.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duur);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + duur + 0.02);
  }catch(e){}
}
function fanfare(){
  if(!S.geluid || !audio) return;
  [523,659,784,1047].forEach((hz,i) => setTimeout(() => piep(hz,.28), i*130));
}

/* -----------------------------------------------------------------
   MELDINGEN
   ----------------------------------------------------------------- */
function meld(tekst){
  const oud = document.querySelector(".melding");
  if(oud) oud.remove();
  clearTimeout(meldingTimer);
  const el = document.createElement("div");
  el.className = "melding"; el.textContent = tekst;
  el.setAttribute("role","status");
  $("app").appendChild(el);
  meldingTimer = setTimeout(() => el.remove(), 2600);
}

  else if(S.fase === "stand")   podium.innerHTML = schermStand();

        const afstand = (waarde != null && waarde !== "") ? Math.abs(Number(waarde) - doel) : null;
        return `
        <div class="gissing-rij">
          <span class="naam">${esc(t.naam)}${gekozen.includes(t.id) ? ' <span style="color:var(--groen-licht)">&check;</span>' : ""}
            ${afstand != null ? `<small>${afstand === 0 ? "precies goed" : afstand.toLocaleString("nl-NL") + " ernaast"}</small>` : "<small>nog niets</small>"}
          </span>
          <input type="number" id="gis-${esc(t.id)}" inputmode="numeric" placeholder="getal"
                 value="${waarde != null ? esc(waarde) : ""}"
                 data-invoer="gissing" data-id="${esc(t.id)}" aria-label="Getal van ${esc(t.naam)}">
        </div>`;
      }).join("")}
    </div>
    <div class="knoprij">
      <button class="knop is-hoofd" data-actie="bereken">Ken de punten toe</button>
      <span class="fijn">Dichtstbij krijgt ${vraagPunten()} punten, precies goed ${vraagPunten() + 2}.</span>
    </div>
  </div>`;
}

/* -----------------------------------------------------------------
   BEDIENING ONDERIN
   ----------------------------------------------------------------- */
function knop(actie, tekst, klasse){
  return `<button class="knop${klasse ? " " + klasse : ""}" data-actie="${actie}">${tekst}</button>`;
}
function tekenBesturing(){
  const f = S.fase;
  let h = knop("menu","&#9776; Menu","is-stil");

  if(f === "ronde"){
    const inTeams = (ronde().teamModus || "individueel") === "teams";
    h += knop("terug","&larr; Terug","is-stil");
    if(inTeams) h += knop("herverdeel","&#9850; Herverdeel");
    h += `<span class="rek"></span>` + knop("start-ronde","Start de ronde &rarr;","is-hoofd");
  }
  else if(f === "vraag"){
    h += knop("terug","&larr; Terug","is-stil");
    h += K.totaal
      ? knop("pauze", K.loopt ? "&#10073;&#10073; Pauze" : "&#9654; Hervat")
      : knop("klok-start","&#9654; Klok starten");
    if(K.totaal) h += knop("plus30","+30s");
    h += `<span class="rek"></span>` + knop("toon-antwoord","Toon het antwoord &rarr;","is-hoofd");
  }
  else if(f === "antwoord"){
    h += knop("terug","&larr; Terug","is-stil");
    h += knop("undo","&#8630; Ongedaan","is-stil");
    h += `<span class="rek"></span>`;
    h += S.v + 1 < vragen().length
      ? knop("volgende","Volgende vraag &rarr;","is-hoofd")
      : knop("volgende","Naar de tussenstand &rarr;","is-hoofd");
  }
  else if(f === "stand"){
    h += knop("terug","&larr; Terug","is-stil");
    h += `<span class="rek"></span>`;
    h += S.r + 1 < rondes().length
      ? knop("volgende-ronde","Volgende ronde &rarr;","is-hoofd")
      : knop("naar-einde","Naar de uitslag &rarr;","is-hoofd");
  }
  else if(f === "einde"){
    h += knop("terug","&larr; Terug","is-stil");
    h += `<span class="rek"></span>` + knop("opnieuw","Nieuwe quiz");
  }
  besturing.innerHTML = h;
}

/* -----------------------------------------------------------------
   NAVIGATIE
   ----------------------------------------------------------------- */
function naarRonde(i){
  stopKlok(); K.totaal = 0;
  S.r = Math.max(0, Math.min(i, rondes().length - 1));
  S.v = 0; S.fase = "ronde";
  teamsVanRonde(S.r);
  bewaar(); teken();
}
function startRonde(){
  if(!S.standVoorRonde[S.r]) S.standVoorRonde[S.r] = {...S.punten};
  S.v = 0; S.fase = "vraag";
  bewaar(); teken(); startKlok(vraagTijd());
}
function toonAntwoord(){
  stopKlok();
  S.fase = "antwoord";
  bewaar(); teken();
}
function volgendeVraag(){
  stopKlok();
  if(S.v + 1 < vragen().length){
    S.v++; S.fase = "vraag";
    bewaar(); teken(); startKlok(vraagTijd());
  } else {
    S.fase = "stand"; K.totaal = 0;
    bewaar(); teken();
  }
}
function terug(){
  stopKlok(); K.totaal = 0;
  if(S.fase === "vraag"){
    if(S.v > 0){ S.v--; S.fase = "antwoord"; } else { S.fase = "ronde"; }
  } else if(S.fase === "antwoord"){
    S.fase = "vraag";
  } else if(S.fase === "stand"){
    S.fase = "antwoord"; S.v = vragen().length - 1;
  } else if(S.fase === "einde"){
    S.fase = "stand"; S.r = rondes().length - 1;
  } else if(S.fase === "ronde"){
    if(S.r > 0){ S.r--; S.v = vragen().length - 1; S.fase = "stand"; }
    else { S.fase = "start"; }
  }
  bewaar(); teken();
}
function naarEinde(){
  stopKlok(); K.totaal = 0;
  S.fase = "einde";
  bewaar(); teken();
  fanfare(); vierFeest();
}

  $("app").appendChild(wrap);

}

function bouwUitslag(){
  const lijst = klassement();
  const regels = [];
  regels.push("BLACKJACKS KWIS — " + pakket().naam);
  regels.push(new Date().toLocaleString("nl-NL"));
  regels.push("");
  regels.push("EINDSTAND");
  lijst.forEach((p,i) => regels.push((i+1) + ". " + p.naam + " — " + p.punten + " punten"));
  regels.push("");
  regels.push("PER RONDE");
  rondes().forEach((r,ri) => {
    const basis = S.standVoorRonde[ri];
    if(!basis) return;
    const volgende = S.standVoorRonde[ri+1] || S.punten;
    const winst = S.spelers
      .map(p => p.naam + " " + ((volgende[p.id] || 0) - (basis[p.id] || 0)))
      .join(", ");
    regels.push((ri+1) + ". " + r.suit + " " + r.naam + " — " + winst);
  });
  return regels.join("\n");
}

/* -----------------------------------------------------------------
   CONFETTI
   ----------------------------------------------------------------- */
const doek = $("confetti");
const ctx = doek.getContext ? doek.getContext("2d") : null;
let snippers = [], feestRaf = 0;

function pasDoekAan(){
  if(!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  doek.width = doek.clientWidth * dpr;
  doek.height = doek.clientHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function vierFeest(){
  if(!ctx) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  pasDoekAan();
  const kleuren = ["#C9A227","#EBD27C","#F5F0E4","#C0452F","#4E9A6B"];
  snippers = Array.from({length: 150}, () => ({
    x: Math.random() * doek.clientWidth,
    y: -20 - Math.random() * doek.clientHeight * .6,
    b: 5 + Math.random() * 6,
    h: 8 + Math.random() * 10,
    vy: 1.8 + Math.random() * 2.6,
    vx: -1 + Math.random() * 2,
    hoek: Math.random() * Math.PI,
    draai: -.08 + Math.random() * .16,
    kleur: kleuren[Math.floor(Math.random() * kleuren.length)]
  }));
  if(feestRaf) cancelAnimationFrame(feestRaf);
  lusFeest();
}
function lusFeest(){
  if(!ctx) return;
  ctx.clearRect(0,0,doek.clientWidth,doek.clientHeight);
  let levend = false;
  snippers.forEach(s => {
    s.y += s.vy; s.x += s.vx; s.hoek += s.draai;
    if(s.y < doek.clientHeight + 30) levend = true;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.hoek);
    ctx.fillStyle = s.kleur;
    ctx.fillRect(-s.b/2, -s.h/2, s.b, s.h);
    ctx.restore();
  });
  if(levend) feestRaf = requestAnimationFrame(lusFeest);
  else ctx.clearRect(0,0,doek.clientWidth,doek.clientHeight);
}
window.addEventListener("resize", pasDoekAan);

/* -----------------------------------------------------------------
   ACTIES
   ----------------------------------------------------------------- */
const ACTIES = {
  "kies-pakket": (id) => { S.pakket = id; S.teams = {}; bewaar(); teken(); },
  "speler-erbij": () => {
    const nr = S.spelers.length + 1;
    S.spelers.push({id:"p" + Date.now().toString(36), naam:"Speler " + nr});
    S.teams = {}; bewaar(); teken();
  },
  "speler-weg": (id) => {
    S.spelers = S.spelers.filter(p => p.id !== id);
    delete S.punten[id]; S.teams = {}; bewaar(); teken();
  },
  "start-quiz": () => {
    wekGeluid();
    S.spelers.forEach((p,i) => { if(!p.naam.trim()) p.naam = "Speler " + (i+1); });
    S.punten = {}; S.toegekend = {}; S.uitgedeeld = {}; S.gissingen = {};
    S.teams = {}; S.standVoorRonde = {}; historie = [];
    S.gestartOp = Date.now();
    naarRonde(0);
  },
  "hervat": () => {
    const d = laadOpgeslagen();
    if(!d){ meld("Geen opgeslagen quiz gevonden"); return; }
    wekGeluid();
    S = Object.assign(LEEG(), d);
    historie = [];
    stopKlok(); K.totaal = 0;
    teken();
    meld("Quiz hervat — de klok staat stil");
  },
  "vergeet": () => { wisOpslag(); teken(); meld("Opgeslagen quiz gewist"); },
  "herverdeel": () => { momentopname(); S.teams[S.r] = maakTeams(S.r); bewaar(); teken(); meld("Teams opnieuw verdeeld"); },
  "verplaats": (id) => { momentopname(); verplaatsSpeler(id); bewaar(); teken(); },
  "start-ronde": () => { wekGeluid(); startRonde(); },
  "toon-antwoord": toonAntwoord,
  "volgende": volgendeVraag,
  "volgende-ronde": () => naarRonde(S.r + 1),
  "naar-einde": naarEinde,
  "terug": terug,
  "pauze": pauzeerKlok,
  "klok-start": () => { startKlok(vraagTijd()); tekenBesturing(); },
  "plus30": () => verlengKlok(30),
  "ken-toe": (id) => wisselToekenning(id),
  "bereken": berekenDichtstbij,
  "undo": herstel,
  "menu": paneelMenu,
  "sluit": sluitPaneel,
  "spring": (id) => { sluitPaneel(); naarRonde(Number(id)); },
  "punt-plus": (id) => { momentopname(); S.punten[id] = (S.punten[id]||0) + 1; bewaar(); paneelMenu(); teken(); },
  "punt-min":  (id) => { momentopname(); S.punten[id] = (S.punten[id]||0) - 1; bewaar(); paneelMenu(); teken(); },
  "geluid": () => {
    S.geluid = !S.geluid;
    if(S.geluid){ wekGeluid(); piep(880,.1); }
    bewaar(); paneelMenu(); teken();
  },
  "exporteer": () => { sluitPaneel(); paneelExport(); },
  "kopieer": () => {
    const ta = $("uitslag-tekst");
    if(!ta) return;
    ta.select(); ta.setSelectionRange(0, 99999);
    const klaar = () => meld("Uitslag gekopieerd");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(klaar).catch(() => meld("Kopiëren lukte niet — selecteer de tekst zelf"));
    } else {
      try{ document.execCommand("copy"); klaar(); }catch(e){ meld("Selecteer de tekst zelf en kopieer"); }
    }
  },
  "download": async () => {
    if(!downloadsCap) return;
    try{
      await downloadsCap.save({filename:"blackjacks-kwis-uitslag.txt", data: bouwUitslag()});
      meld("Bestand aangeboden");
    }catch(e){ meld("Opslaan lukte niet — gebruik Kopieer"); }
  },
  "opnieuw": () => {
    if(!confirm("Weet je het zeker? De hele stand wordt gewist.")) return;
    sluitPaneel(); wisOpslag();
    const geluid = S.geluid;
    S = LEEG(); S.geluid = geluid;
    historie = []; stopKlok(); K.totaal = 0;
    teken();
  }
};

/* -----------------------------------------------------------------
   GEBEURTENISSEN
   ----------------------------------------------------------------- */
$("app").addEventListener("click", (e) => {
  const doel = e.target.closest("[data-actie]");
  if(!doel) return;
  const fn = ACTIES[doel.dataset.actie];
  if(fn) fn(doel.dataset.id);
});

$("app").addEventListener("input", (e) => {
  const doel = e.target.closest("[data-invoer]");
  if(!doel) return;
  if(doel.dataset.invoer === "spelernaam"){
    const p = speler(doel.dataset.id);
    if(p){ p.naam = doel.value; bewaar(); }
  }
  if(doel.dataset.invoer === "gissing"){
    const key = sleutel();
    if(!S.gissingen[key]) S.gissingen[key] = {};
    S.gissingen[key][doel.dataset.id] = doel.value;
    bewaar();
  }
});

document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  if(e.key === "Escape"){ sluitPaneel(); return; }
  if(document.querySelector(".paneel-achtergrond")) return;
  if(e.key === " " || e.key === "Enter"){
    e.preventDefault();
    if(S.fase === "start") ACTIES["start-quiz"]();
    else if(S.fase === "ronde") startRonde();
    else if(S.fase === "vraag") toonAntwoord();
    else if(S.fase === "antwoord") volgendeVraag();
    else if(S.fase === "stand"){ S.r + 1 < rondes().length ? naarRonde(S.r + 1) : naarEinde(); }
  }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); if(S.fase !== "start") terug(); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); if(S.fase === "vraag") toonAntwoord(); else if(S.fase === "antwoord") volgendeVraag(); }
  else if(e.key === "p" || e.key === "P"){ if(S.fase === "vraag") pauzeerKlok(); }
  else if(e.key === "t" || e.key === "T"){ if(S.fase === "vraag") verlengKlok(30); }
  else if(e.key === "z" || e.key === "Z"){ herstel(); }
});

/* -----------------------------------------------------------------
   OPSTARTEN
   ----------------------------------------------------------------- */
(function(){
  const d = laadOpgeslagen();
  if(d && d.fase === "start") S = Object.assign(LEEG(), d);
  pasDoekAan();
  teken();
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads")
      .then(cap => { downloadsCap = cap || null; })
      .catch(() => { downloadsCap = null; });
  }
})();
