<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaaroverzicht 2026</title>
<style>
  @font-face { font-family: Anton; src: url(fonts/Anton.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url(fonts/Space-Grotesk_wght_500.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(fonts/Space-Grotesk_wght_700.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(fonts/JetBrains-Mono_wght_400.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(fonts/JetBrains-Mono_wght_700.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; cursor: pointer; }
  body.capture canvas { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="geo.js"></script>
<script src="reel-data.js"></script>
<script>
/*
 * Jaaroverzicht 2026. Every frame is a pure function of time, so the same code plays
 * live in the browser and renders frame-exact to video. The order, the news and the
 * timing all come from reel-data.js; the music is locked to 120 BPM.
 */
const W = 1920, H = 1080, FPS = 60;
const { B, BAR, MAANDEN, MEMORIAM } = REEL;
const { seq: SEQ, total: DUR } = REEL.sequence();
const C = {
  ink: '#0B0B0E', paper: '#F2ECE1', fire: '#FF4A1C', blue: '#2F4BFF',
  lime: '#D8FF3C', deep: '#050507',
};
const FD = 'Anton, Impact, sans-serif';
const FS = '"Space Grotesk", sans-serif';
const FM = '"JetBrains Mono", monospace';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------------------------------------------------------------- utilities
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outQuart: t => 1 - Math.pow(1 - t, 4),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0; let t = s;
    t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const beatPulse = (t, k = 7) => { const u = ((t % B) + B) % B; return Math.exp(-u * k); };
const col = name => C[name] || name;

function font(f, size, weight = '') { return `${weight} ${size}px ${f}`; }
function txt(s, x, y, o = {}) {
  const { f = FS, size = 40, weight = '', color = C.paper, align = 'center', base = 'middle', track = 0, alpha = 1, stroke = 0 } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.font = font(f, size, weight);
  ctx.textAlign = align; ctx.textBaseline = base;
  ctx.letterSpacing = track + 'px';
  ctx.globalAlpha *= alpha;
  const xx = align === 'center' ? x + track / 2 : align === 'right' ? x + track : x;
  if (stroke) { ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, xx, y); }
  else { ctx.fillStyle = color; ctx.fillText(s, xx, y); }
  ctx.restore();
}
const layoutCache = new Map();
function layout(s, fnt) {
  const key = s + '|' + fnt;
  if (layoutCache.has(key)) return layoutCache.get(key);
  ctx.save(); ctx.font = fnt; ctx.letterSpacing = '0px';
  const chars = [];
  for (let i = 0; i < s.length; i++) chars.push({ ch: s[i], x: ctx.measureText(s.slice(0, i)).width, w: ctx.measureText(s[i]).width });
  const out = { chars, width: ctx.measureText(s).width };
  ctx.restore();
  layoutCache.set(key, out);
  return out;
}
const wrapCache = new Map();
function wrap(s, fnt, maxW) {
  const key = s + '|' + fnt + '|' + maxW;
  if (wrapCache.has(key)) return wrapCache.get(key);
  ctx.save(); ctx.font = fnt; ctx.letterSpacing = '0px';
  const lines = []; let cur = '';
  for (const w of s.split(' ')) {
    const tryL = cur ? cur + ' ' + w : w;
    if (ctx.measureText(tryL).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tryL;
  }
  if (cur) lines.push(cur);
  ctx.restore();
  wrapCache.set(key, lines);
  return lines;
}
function measure(s, fnt, track = 0) { ctx.save(); ctx.font = fnt; ctx.letterSpacing = track + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
let CAP = 0.73, DIGW = 0.46;
const capH = size => CAP * size;
function digits(s, cx, cy, size, color, o = {}) { txt(s, cx, cy + capH(size) / 2, { f: FD, size, color, base: 'alphabetic', ...o }); }
function rect(x, y, w, h, color, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color; ctx.fillRect(x, y, w, h); ctx.restore(); }
function circle(x, y, r, color, a = 1) { if (r <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore(); }
function ring(x, y, r, color, w = 2, a = 1) { if (r <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.restore(); }
function line(x1, y1, x2, y2, color, w = 2, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function clipRect(x, y, w, h) { ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); }
const pad2 = n => String(n).padStart(2, '0');
const nl = n => Math.round(n).toLocaleString('nl-NL');

const MND = ['JAN', 'FEB', 'MRT', 'APR', 'MEI', 'JUN', 'JUL', 'AUG', 'SEP', 'OKT', 'NOV', 'DEC'];
const MONTH_START = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
const JAN1_WEEKDAY = 4; // 1 januari 2026 was een donderdag
function dateOf(day) {
  const d = new Date(Date.UTC(2026, 0, 1) + Math.round(day) * 864e5);
  return { m: d.getUTCMonth(), d: d.getUTCDate() };
}

// ================================================= 1 · HET AFTELLEN (8 s)
const REEL_TARGET = [2, 0, 2, 5];
function reelV(i, t) {
  const p = E.outExpo(P(t, 1.2, 3.0 + 0.3 * i));
  let v = REEL_TARGET[i] - (i + 1) * 10 * (1 - p);
  if (i === 3) v += E.outBack(P(t, 6.0, 6.4));
  return v;
}
function drawReelColumn(cx, cy, size, v, vPrev, color) {
  const dh = size * 1.02;
  const n = Math.min(10, 1 + Math.ceil(Math.abs(v - vPrev) * 4));
  for (let s = 0; s < n; s++) {
    const vv = n === 1 ? v : lerp(vPrev, v, (s + 1) / n);
    const base = Math.floor(vv), frac = vv - base;
    ctx.save();
    ctx.globalAlpha *= n === 1 ? 1 : Math.min(1, 1.7 / n);
    for (let k = -1; k <= 1; k++) digits(String(((base + k) % 10 + 10) % 10), cx, cy + (k - frac) * dh, size, color);
    ctx.restore();
  }
}
function sRol(t) {
  rect(0, 0, W, H, C.ink);
  const grow = E.outExpo(P(t, 0.15, 1.2));
  const open = E.outExpo(P(t, 0.8, 1.6));
  const blow = E.inExpo(P(t, 7.0, 8.0));
  const push = 1 + 0.04 * E.inOutSine(P(t, 3.6, 7.0));
  const gap = lerp(2, 400, open) * push + blow * 1400;
  const len = 1500 * grow;
  const yT = H / 2 - gap / 2, yB = H / 2 + gap / 2;

  ctx.save();
  ctx.globalAlpha = 0.18 * open * (1 - blow);
  for (let x = -((t * 120) % 40); x < W; x += 40) line(x, yT - 14, x, yT - (Math.round((x + t * 120) / 40) % 5 === 0 ? 34 : 22), C.paper, 1);
  for (let x = -((t * 90) % 40) + 20; x < W; x += 40) line(x, yB + 14, x, yB + 24, C.paper, 1);
  ctx.restore();
  line(W / 2 - len / 2, yT, W / 2 + len / 2, yT, C.paper, 2);
  line(W / 2 - len / 2, yB, W / 2 + len / 2, yB, C.paper, 2);

  ctx.save();
  clipRect(0, yT + 1, W, gap - 2);
  const g = E.inExpo(P(t, 7.0, 8.0));
  const size = lerp(300 * push, 880, g);
  const sp = DIGW * 300 * 1.12 * push;
  for (let i = 0; i < 4; i++) {
    const x = lerp(W / 2 + (i - 1.5) * sp, W / 8 * (2 * i + 1), g);
    drawReelColumn(x, H / 2, size, reelV(i, t), reelV(i, t - 1 / FPS), C.paper);
  }
  ctx.restore();

  const la = open * (1 - blow);
  const x0 = W / 2 - 750;
  txt('DE BLACKJACKS PRESENTEREN', x0, yT - 58, { f: FM, size: 20, align: 'left', track: 6, alpha: la * P(t, 1.0, 1.4) });
  txt('Δ +1', W / 2 + 750, yT - 58, { f: FM, size: 20, align: 'right', track: 4, alpha: la * P(t, 6.0, 6.1), color: C.fire });
  const pct = Math.round(100 * E.outExpo(P(t, 1.2, 3.9)));
  const status = t < 4 ? `JAAR LADEN ${String(pct).padStart(3, ' ')}%` : t < 6 ? '2025 · AFGEROND' : '2026 · BEGINT NU';
  txt(status, W / 2 + 750, yB + 60, { f: FM, size: 20, align: 'right', track: 6, alpha: la, color: t >= 6 ? C.fire : C.paper });
  rect(x0, yB + 52, 300 * pct / 100, 6, C.fire, la);
  line(x0, yB + 55, x0 + 300, yB + 55, C.paper, 1, la * 0.4);
}

// ============================================== 2 · DE KNAL: 2026 (8 s)
const S2COL = [C.fire, C.paper, C.blue, C.fire];
const S2INK = [C.ink, C.ink, C.paper, C.ink];
function sKnal(lt) {
  const cols = [0, 1, 2, 3].map(i => ({ x: W / 8 * (2 * i + 1), y: H / 2 }));
  const size = 880;
  const flip = lt >= 3 * BAR;
  const zp = P(lt, 3 * BAR + 0.8, 4 * BAR);
  const zs = Math.pow(70, E.inCubic(zp));
  const zc = cols[1];
  ctx.save();
  if (flip) {
    const settle = 1 + 0.03 * (1 - E.outExpo(P(lt, 3 * BAR, 3 * BAR + 0.6)));
    ctx.translate(lerp(zc.x, W / 2, E.inOutCubic(zp)), lerp(zc.y, H / 2, E.inOutCubic(zp)));
    ctx.scale(zs * settle, zs * settle);
    ctx.translate(-zc.x, -zc.y);
  }
  rect(-W, -H, W * 3, H * 3, flip ? C.paper : C.ink);
  if (!flip) {
    // colour rotation on every beat through the second bar
    const swap = lt >= BAR ? Math.min(4, Math.floor((lt - BAR) / B) + 1) : 0;
    const retract = lt >= 2 * BAR;
    for (let i = 0; i < 4; i++) {
      const ci = (i + swap) % 4;
      const hh = H * E.outExpo(P(lt, 0.025 * i, 0.35 + 0.025 * i));
      const off = retract ? E.inExpo(P(lt, 2 * BAR + 0.04 * i, 2 * BAR + 0.3 + 0.04 * i)) * H * 1.05 : 0;
      const x0 = W / 4 * i, top = H - hh - off;
      rect(x0, top, W / 4 + 1, hh, S2COL[ci]);
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, 0, W / 4, H); ctx.clip();
      drawKnalDigit(i, cols[i], size, C.paper, lt);
      ctx.beginPath(); ctx.rect(x0, top, W / 4, hh); ctx.clip();
      drawKnalDigit(i, cols[i], size, S2INK[ci], lt);
      ctx.restore();
    }
    // echo outlines, one pulse per beat in the third bar
    if (retract) {
      const ep = ((lt - 2 * BAR) % B) / B;
      for (let k = 1; k <= 5; k++) {
        const s = 1 + k * 0.07 * E.outExpo(ep);
        ctx.save();
        ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
        ctx.globalAlpha = (1 - ep) * (0.6 - k * 0.1);
        for (let i = 0; i < 4; i++) digits('2026'[i], cols[i].x, cols[i].y, size, k % 2 ? C.fire : C.paper, { stroke: 3 / s });
        ctx.restore();
      }
    }
  } else {
    for (let i = 0; i < 4; i++) digits('2026'[i], cols[i].x, cols[i].y, size, C.ink);
    ctx.save(); ctx.globalAlpha = 1 - zp;
    for (let i = 0; i < 4; i++) txt('0' + (i + 1), cols[i].x, cols[i].y + capH(size) / 2 + 60, { f: FM, size: 18, color: C.ink, track: 4 });
    ctx.restore();
  }
  ctx.restore();
  const fl = flip ? Math.exp(-(lt - 3 * BAR) * 14) : 0;
  if (fl > 0.01) rect(0, 0, W, H, '#fff', fl * 0.6);
}
function drawKnalDigit(i, c, size, color, lt) {
  const ch = '2026'[i];
  const g = lt >= BAR ? Math.exp(-(lt - BAR) * 7) : 0;
  if (g < 0.02) { digits(ch, c.x, c.y, size, color); return; }
  const bands = 9, top = c.y - capH(size) / 2 - 20, bh = (capH(size) + 40) / bands;
  for (let b = 0; b < bands; b++) {
    const off = 140 * Math.sin(b * 2.3 + i * 1.7) * g * (b % 2 ? 1 : -1);
    ctx.save();
    ctx.beginPath(); ctx.rect(c.x - 400, top + b * bh, 800, bh + 1); ctx.clip();
    ctx.globalAlpha *= 0.85;
    digits(ch, c.x + off - 18 * g, c.y, size, C.fire);
    digits(ch, c.x + off + 18 * g, c.y, size, C.blue);
    ctx.globalAlpha = 1;
    digits(ch, c.x + off, c.y, size, color);
    ctx.restore();
  }
}

// =============================================== 3 · 365 DAGEN (12 s)
const GRID = { pitch: 30, cell: 24, cols: 53 };
GRID.x0 = (W - GRID.cols * GRID.pitch) / 2 + 3;
GRID.y0 = 590;
const DAY_LEVEL = (() => { const r = rng(2026); return Array.from({ length: 365 }, () => Math.floor(Math.pow(r(), 1.3) * 5)); })();
const LEVEL_COL = ['#DCD4C4', '#FFC3A6', '#FF9166', '#FF6A3D', C.fire];
const ORBIT = { cx: W / 2, cy: H / 2 + 40, rx: 640, ry: 230 };
const ORBIT_DUR = 6 * BAR;
const ORBIT_ROT = lt => lerp(-0.12, 0.05, lt / ORBIT_DUR);
const dayAngle = d => Math.PI / 2 + TAU * d / 365;
function orbitPos(a, rot, scale = 1) {
  const x0 = Math.cos(a) * ORBIT.rx * scale, y0 = Math.sin(a) * ORBIT.ry * scale;
  return { x: ORBIT.cx + x0 * Math.cos(rot) - y0 * Math.sin(rot), y: ORBIT.cy + x0 * Math.sin(rot) + y0 * Math.cos(rot), depth: Math.sin(a) };
}
function gridPos(d) {
  const c = Math.floor((d + JAN1_WEEKDAY) / 7), r = (d + JAN1_WEEKDAY) % 7;
  return { col: c, row: r, x: GRID.x0 + c * GRID.pitch, y: GRID.y0 + r * GRID.pitch };
}
const LAST = 364; // oudejaarsdag
function sRaster(lt) {
  rect(0, 0, W, H, C.paper);
  const exitP = E.inOutExpo(P(lt, 10.0, 11.8));
  const portal = E.inOutExpo(P(lt, 9.9, 11.7)) * 1200;
  if (portal > 0) circle(ORBIT.cx, ORBIT.cy, portal, C.ink);
  const punch = 1 + 0.01 * beatPulse(lt, 9) * (1 - exitP);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(punch, punch); ctx.translate(-W / 2, -H / 2);

  const out = 1 - P(lt, 9.8, 10.2);
  const hy = E.inExpo(P(lt, 9.8, 10.3)) * -420;
  ctx.save();
  clipRect(0, 150, W, 330);
  const cnt = Math.round(365 * E.outExpo(P(lt, 0.3, 3.0)));
  const rise = (1 - E.outExpo(P(lt, 0, 0.6))) * 320;
  txt(String(cnt).padStart(3, '0'), GRID.x0 - 8, 440 + rise + hy, { f: FD, size: 300, color: C.ink, align: 'left', base: 'alphabetic' });
  const lw = layout('365', font(FD, 300)).width;
  txt('DAGEN', GRID.x0 + lw + 30, 330 + rise * 1.3 + hy, { f: FS, size: 76, weight: 700, color: C.ink, align: 'left', base: 'alphabetic', track: 4 });
  txt('53 WEKEN · BEGON OP EEN DONDERDAG', GRID.x0 + lw + 34, 390 + rise * 1.6 + hy, { f: FM, size: 22, color: C.ink, align: 'left', track: 3, alpha: 0.7 });
  txt('VANAVOND IS DAG 365', GRID.x0 + lw + 34, 432 + rise * 1.9 + hy, { f: FM, size: 22, weight: 700, color: C.fire, align: 'left', track: 3, alpha: P(lt, 3.2, 3.5) });
  ctx.restore();

  for (let m = 0; m < 12; m++) {
    const g = gridPos(MONTH_START[m]);
    const a = P(lt, 0.4 + m * 0.08, 0.7 + m * 0.08) * out;
    txt(MND[m], g.x + (g.row > 0 ? GRID.pitch : 0), GRID.y0 - 34 + (1 - a) * 14, { f: FM, size: 17, color: C.ink, align: 'left', alpha: a, track: 2 });
  }
  const wave = (lt - 4.2) * 13; // a highlight that sweeps the year once
  const rot0 = ORBIT_ROT(0);
  for (let d = 0; d < 365; d++) {
    const g = gridPos(d);
    const delay = 0.2 + g.col * 0.04 + g.row * 0.05;
    const s = E.outBack(P(lt, delay, delay + 0.35));
    if (s <= 0) continue;
    const o = orbitPos(dayAngle(d), rot0);
    const hl = Math.exp(-Math.pow(g.col - wave, 2) / 5) * (1 - exitP);
    const cx = lerp(g.x + GRID.cell / 2, o.x, exitP), cy = lerp(g.y + GRID.cell / 2, o.y, exitP) - hl * 6;
    const sz = lerp(GRID.cell * (1 + 0.25 * hl), 5 + 2 * (o.depth + 1) / 2, exitP) * s;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(cx - sz / 2, cy - sz / 2, sz, sz, lerp(4, sz / 2, exitP));
    if (d === LAST) ctx.fillStyle = exitP > 0.5 ? C.paper : C.ink;
    else { ctx.fillStyle = exitP > 0.5 ? C.paper : LEVEL_COL[Math.min(4, DAY_LEVEL[d] + (hl > 0.5 ? 1 : 0))]; ctx.globalAlpha = lerp(1, 0.55, exitP); }
    ctx.fill();
    ctx.restore();
  }
  const tg = gridPos(LAST);
  const ta = P(lt, 3.5, 3.8) * out;
  if (ta > 0) {
    const tx = tg.x + GRID.cell / 2, ty = tg.y + GRID.cell / 2;
    const pr = lt % 1;
    ring(tx, ty, 16 + pr * 30, C.fire, 3, ta * (1 - pr));
    const ly = GRID.y0 + 7 * GRID.pitch + 40;
    line(tx, ty + 18, tx, ly - 10 + (1 - E.outExpo(P(lt, 3.5, 3.9))) * -60, C.ink, 2, ta);
    txt('VANAVOND · 31 DEC', tx + 14, ly + 10, { f: FM, size: 20, weight: 700, color: C.ink, track: 3, align: 'right', alpha: ta });
  }
  const lg = P(lt, 2.0, 2.4) * out;
  txt('RUSTIG', GRID.x0, GRID.y0 + 7 * GRID.pitch + 48, { f: FM, size: 16, color: C.ink, align: 'left', alpha: lg * 0.6, track: 2 });
  for (let k = 0; k < 5; k++) rect(GRID.x0 + 80 + k * 22, GRID.y0 + 7 * GRID.pitch + 40, 16, 16, LEVEL_COL[k], lg);
  txt('DRUK', GRID.x0 + 200, GRID.y0 + 7 * GRID.pitch + 48, { f: FM, size: 16, color: C.ink, align: 'left', alpha: lg * 0.6, track: 2 });
  ctx.restore();
}

// ============================================ 4 · ÉÉN RONDJE ZON (12 s)
const EARTH_DAYS = lt => 365 * E.inOutCubic(P(lt, 0.8, 9.4));
function sBaan(lt) {
  rect(0, 0, W, H, C.ink);
  const rot = ORBIT_ROT(lt), ed = EARTH_DAYS(lt);
  const sunGrow = E.outBack(P(lt, 0.0, 0.8));
  const fill = Math.pow(34, E.inCubic(P(lt, 10.8, 12)));
  const sunR = 80 * sunGrow * (1 + 0.06 * beatPulse(lt, 8)) * fill;
  const ep = orbitPos(dayAngle(ed), rot);
  const sr = rng(44);
  for (let i = 0; i < 140; i++) {
    const x = sr() * W, y = sr() * H, s = sr();
    circle(((x - lt * 20 * s) % W + W) % W, y, 0.6 + s * 1.3, C.paper, 0.15 + 0.35 * s * (0.6 + 0.4 * Math.sin(lt * 3 + i)));
  }
  ctx.save();
  ctx.strokeStyle = C.paper; ctx.globalAlpha = 0.12; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let k = 0; k <= 180; k++) { const o = orbitPos(TAU * k / 180, rot); k ? ctx.lineTo(o.x, o.y) : ctx.moveTo(o.x, o.y); }
  ctx.stroke(); ctx.restore();
  const drawDots = back => {
    for (let d = 0; d < 365; d++) {

  ['DE REST', 'VAN HET NIEUWS', 'HOOR JE', 'VANAVOND.'].forEach((s, i) => {
    const p = E.outExpo(P(lt, 5.2 + i * 0.12, 5.8 + i * 0.12));
    txt(s, W / 2 + 280, 420 + i * 100 + (1 - p) * 120, { f: FD, size: 96, color: i === 3 ? C.fire : C.paper, align: 'left', base: 'alphabetic', alpha: ta });
  });
  ctx.restore();
}

// ================================================= 10 · DE KWIS (12 s)
let PARTS = null;
const FINAL = { size: 560, y: H / 2 - 60 };
function buildParticles() {
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const o = oc.getContext('2d');
  o.fillStyle = '#fff'; o.font = font(FD, FINAL.size); o.textAlign = 'center'; o.textBaseline = 'alphabetic';
  o.fillText('2026', W / 2, FINAL.y + capH(FINAL.size) / 2);
  const data = o.getImageData(0, 0, W, H).data;
  const r = rng(314);
  PARTS = [];
  for (let y = 0; y < H; y += 6) for (let x = 0; x < W; x += 6) {
    if (data[(y * W + x) * 4 + 3] > 128) {
      const a = r() * TAU, d = 250 + r() * 900, c = r();
      PARTS.push({ tx: x + (r() - .5) * 2, ty: y + (r() - .5) * 2, mx: W / 2 + Math.cos(a) * d * 1.4, my: H / 2 + Math.sin(a) * d * 0.8, sx: W / 2 + (r() - .5) * 40, sy: H / 2 + (r() - .5) * 40, col: c < 0.7 ? 0 : c < 0.86 ? 1 : 2, dl: r() * 0.15 });
    }
  }
}
function partPos(p, u) {
  const burst = E.outExpo(P(u, 0, 0.5));
  const q = E.inOutExpo(P(u, 0.4 + (p.tx / W) * 0.3 + p.dl, 1.5 + (p.tx / W) * 0.2 + p.dl));
  const bx = lerp(p.sx, p.mx, burst), by = lerp(p.sy, p.my, burst);
  const sw = (1 - q) * burst * 0.6;
  const dx = bx - W / 2, dy = by - H / 2;
  const rx = W / 2 + dx * Math.cos(sw) - dy * Math.sin(sw), ry = H / 2 + dx * Math.sin(sw) + dy * Math.cos(sw);
  return { x: lerp(rx, p.tx, q), y: lerp(ry, p.ty, q) };
}
function sFinale(lt, sc) {
  rect(0, 0, W, H, C.ink);
  if (!PARTS) buildParticles();
  const S = BAR; // the solid 2026 lands on the second bar
  const up = E.inOutExpo(P(lt, 3 * BAR, 3 * BAR + 0.8));
  const cnt = lt >= 5 * BAR - 0.001;
  ctx.save();
  ctx.translate(0, -up * 250);
  ctx.translate(W / 2, FINAL.y); ctx.scale(1 - up * 0.45, 1 - up * 0.45); ctx.translate(-W / 2, -FINAL.y);
  const solid = P(lt, S - 0.02, S + 0.1);
  const pa = 1 - P(lt, S, S + 0.3);
  if (pa > 0) {
    const cols = [C.paper, C.fire, C.blue];
    for (let c = 0; c < 3; c++) {
      ctx.save(); ctx.strokeStyle = cols[c]; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.globalAlpha = pa;
      ctx.beginPath();
      for (const p of PARTS) {
        if (p.col !== c) continue;
        const a = partPos(p, lt), b = partPos(p, lt - 1 / FPS);
        ctx.moveTo(b.x, b.y); ctx.lineTo(a.x + 0.01, a.y);
      }
      ctx.stroke(); ctx.restore();
    }
  }
  if (solid > 0) {
    const sc2 = lerp(1.05, 1, E.outExpo(P(lt, S, S + 0.5)));
    ctx.save();
    ctx.translate(W / 2, FINAL.y); ctx.scale(sc2, sc2); ctx.translate(-W / 2, -FINAL.y);
    const sh = E.inOutCubic(P(lt, 2 * BAR, 2 * BAR + 0.7));
    const g = ctx.createLinearGradient(0, 0, W, 0);
    const pos = lerp(-0.2, 1.2, sh);
    const st = (o, c) => { if (o >= 0 && o <= 1) g.addColorStop(o, c); };
    g.addColorStop(0, C.paper); st(pos - 0.12, C.paper); st(pos - 0.04, C.fire); st(pos, '#FFFFFF'); st(pos + 0.04, C.blue); st(pos + 0.12, C.paper); g.addColorStop(1, C.paper);
    ctx.globalAlpha = solid;
    digits('2026', W / 2, FINAL.y, FINAL.size, sh > 0 && sh < 1 ? g : C.paper);
    ctx.restore();
  }
  const uy = FINAL.y + capH(FINAL.size) / 2 + 58;
  [C.fire, C.blue, C.paper].forEach((c, i) => {
    const p = E.outExpo(P(lt, S + 0.1 + i * 0.08, S + 0.6 + i * 0.08));
    rect(W / 2 - 450 + i * 300, uy, 300 * p, 8, c);
  });
  const sub = 'EEN JAAR IN BEWEGING';
  const SL = layout(sub, font(FS, 44, 500)), tr = 22;
  const sw = SL.width + tr * (sub.length - 1);
  sub.split('').forEach((ch, i) => {
    const p = E.outExpo(P(lt, S + 0.2 + i * 0.02, S + 0.6 + i * 0.02));
    txt(ch, W / 2 - sw / 2 + SL.chars[i].x + tr * i, uy + 88 + (1 - p) * 30, { f: FS, size: 44, weight: 500, color: C.paper, align: 'left', base: 'alphabetic', alpha: p * (1 - up) });
  });
  ctx.restore();
  const fl = lt >= S ? Math.exp(-(lt - S) * 10) : 0;
  if (fl > 0.01) rect(0, 0, W, H, '#fff', fl * 0.5);

  // the invitation
  const ia = P(lt, 3 * BAR + 0.3, 3 * BAR + 0.6);
  const tl = 'BLACKJACKS KWIS', TL = layout(tl, font(FD, 170));
  if (ia > 0) {
    ctx.save(); clipRect(0, 520, W, 190);
    TL.chars.forEach((c, i) => {
      const p = E.outExpo(P(lt, 3 * BAR + 0.3 + i * 0.03, 3 * BAR + 0.9 + i * 0.03));
      txt(c.ch, W / 2 - TL.width / 2 + c.x, 690 + (1 - p) * 200, { f: FD, size: 170, color: C.paper, align: 'left', base: 'alphabetic' });
    });
    ctx.restore();
  }
  txt('OUDEJAARSAVOND · 31.12.2026', W / 2, 760, { f: FM, size: 26, weight: 700, color: C.fire, track: 10, alpha: ia * P(lt, 3 * BAR + 1, 3 * BAR + 1.3) });
  txt('MOTION DESIGN, TYPE, CODE & SOUND — CLAUDE', W / 2, 820, { f: FM, size: 16, color: C.paper, track: 6, alpha: ia * 0.55 * P(lt, 4 * BAR, 4 * BAR + 0.3) });

  // countdown on the last bar
  if (cnt) {
    const k = Math.min(3, Math.floor((lt - 5 * BAR) / B));
    const u = lt - 5 * BAR - k * B;
    const lbl = ['3', '2', '1', 'START'][k];
    const bgc = [C.fire, C.blue, C.paper, C.ink][k];
    const fgc = [C.ink, C.paper, C.ink, C.fire][k];
    rect(0, 0, W, H, bgc);
    const s = lerp(1.6, 1, E.outExpo(P(u, 0, 0.3)));
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
    digits(lbl, W / 2, H / 2, k < 3 ? 700 : 400, fgc);
    ctx.restore();
    const cl = E.inExpo(P(lt, sc.dur - 0.3, sc.dur - 0.03));
    if (cl > 0) { rect(0, 0, W, H / 2 * cl, '#000'); rect(0, H - H / 2 * cl, W, H / 2 * cl + 1, '#000'); }
  }
}

// ============================================================ sequencing
const DRAW = { rol: sRol, knal: sKnal, raster: sRaster, baan: sBaan, getallen: sGetallen, nieuws: sNieuws, maand: sMaand, memoriam: sMemoriam, dossier: sDossier, finale: sFinale };
function sceneIndex(t) { let i = 0; while (i < SEQ.length - 1 && t >= SEQ[i + 1].start) i++; return i; }
function drawScene(i, lt) { const sc = SEQ[i]; DRAW[sc.kind](lt, sc, SEQ[i + 1]); }
const WIPE_IN = { maand: true, memoriam: true, dossier: true };
function wipeClip(kind, p) {
  ctx.beginPath();
  if (kind === 0) ctx.arc(W / 2, H / 2, 1150 * p, 0, TAU);
  else if (kind === 1) { const x = lerp(-500, W + 500, p); ctx.moveTo(-600, 0); ctx.lineTo(x + 250, 0); ctx.lineTo(x - 250, H); ctx.lineTo(-600, H); }
  else if (kind === 2) { for (let i = 0; i < 6; i++) { const q = E.inOutCubic(clamp(p * 1.5 - i * 0.1)); ctx.rect(W / 6 * i, 0, W / 6 + 1, H * q); } }
  else { const h = H / 2 * p; ctx.rect(0, H / 2 - h, W, h * 2); }
  ctx.clip();
}

// ============================================================== overlays
function hud(t) {
  const a = P(t, 0.3, 0.8) * (1 - P(t, DUR - 0.6, DUR - 0.2));
  if (a <= 0) return;
  const colr = C.paper;
  ctx.save(); ctx.globalAlpha = a * 0.85; ctx.globalCompositeOperation = 'difference';
  const m = 44, L = 26;
  ctx.strokeStyle = colr; ctx.lineWidth = 2;
  ctx.beginPath();
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, dx, dy]) => { ctx.moveTo(x + dx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * L); });
  ctx.stroke();
  const f = Math.floor(t * FPS + 1e-6);
  circle(m + 30, m + 38, 6, colr, beatPulse(t, 5) > 0.3 ? 1 : 0.3);
  txt('BLACKJACKS KWIS / JAAROVERZICHT', m + 48, m + 39, { f: FM, size: 16, weight: 700, color: colr, align: 'left', track: 4 });
  const sec = Math.floor(f / FPS);
  txt(`TC 00:${pad2(Math.floor(sec / 60))}:${pad2(sec % 60)}:${pad2(f % FPS)}`, W - m - 26, m + 39, { f: FM, size: 16, weight: 700, color: colr, align: 'right', track: 3 });
  const i = sceneIndex(t);
  txt(`${pad2(i + 1)}/${pad2(SEQ.length)}  ${SEQ[i].naam}`, m + 26, H - m - 40, { f: FM, size: 16, weight: 700, color: colr, align: 'left', track: 4 });
  txt('1920×1080 · 60 FPS · 120 BPM', W - m - 26, H - m - 40, { f: FM, size: 16, color: colr, align: 'right', track: 3 });
  const px0 = m + 26, px1 = W - m - 26, py = H - m - 16;
  line(px0, py, px1, py, colr, 1, 0.3);
  line(px0, py, lerp(px0, px1, t / DUR), py, colr, 3);
  for (let k = 1; k < SEQ.length; k++) { const x = lerp(px0, px1, SEQ[k].start / DUR); line(x, py - 5, x, py + 5, colr, 1, 0.6); }
  ctx.restore();
}
let GRAIN = [];
function buildGrain() {
  const r = rng(5);
  for (let k = 0; k < 4; k++) {
    const g = document.createElement('canvas'); g.width = 700; g.height = 400;
    const o = g.getContext('2d'); const im = o.createImageData(700, 400);
    for (let i = 0; i < im.data.length; i += 4) { const v = Math.floor(r() * 255); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    o.putImageData(im, 0, 0); GRAIN.push(g);
  }
}
function post(t) {
  const f = Math.floor(t * FPS + 1e-6);
  ctx.save();
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.1;
  const r = rng(f + 1);
  ctx.drawImage(GRAIN[f % 4], -r() * 180, -r() * 100, 2100, 1200);
  ctx.restore();
  ctx.save();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.15);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
const IMPACTS = (() => {
  const out = [];
  SEQ.forEach(sc => {
    if (sc.kind === 'knal') out.push([sc.start, 16], [sc.start + 3 * BAR, 6]);
    if (sc.kind === 'raster') out.push([sc.start, 6]);
    if (sc.kind === 'getallen') out.push([sc.start, 12]);
    if (sc.kind === 'maand') {
      out.push([sc.start, 7]);
      sc.items.forEach((it, k) => { if (it.vorm === 'zon') out.push([sc.start + HEAD + k * ITEM + 2 * BAR, 14]); });
    }
    if (sc.kind === 'dossier') out.push([sc.start + 2 * BAR, 12]);
    if (sc.kind === 'finale') out.push([sc.start + BAR, 12], [sc.start + 5 * BAR, 8], [sc.start + 5 * BAR + B, 8], [sc.start + 5 * BAR + 2 * B, 8], [sc.start + 5 * BAR + 3 * B, 14]);
  });
  return out;
})();
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, amp] of IMPACTS) {
    if (t < ti || t > ti + 0.6) continue;
    const d = Math.exp(-(t - ti) * 13) * amp;
    x += Math.sin((t - ti) * 95) * d; y += Math.cos((t - ti) * 71) * d;
  }
  return [x, y];
}

// ================================================================ render
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  rect(0, 0, W, H, '#000');
  const [sx, sy] = shake(t);
  ctx.save();
  ctx.translate(sx, sy);
  const z = 1 + Math.hypot(sx, sy) / 900;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  const i = sceneIndex(t), sc = SEQ[i], lt = t - sc.start;
  const WIPE = 0.5;
  if (WIPE_IN[sc.kind] && i > 0 && SEQ[i - 1].kind !== 'nieuws' && lt < WIPE) {
    drawScene(i - 1, SEQ[i - 1].dur - 1e-4);
    ctx.save();
    wipeClip(i % 4, E.inOutCubic(lt / WIPE));
    drawScene(i, lt);
    ctx.restore();
  } else drawScene(i, lt);
  ctx.restore();
  hud(t);
  post(t);
}

// ================================================================== boot
async function boot() {
  await document.fonts.ready;
  await Promise.all([font(FD, 100), font(FS, 40, 700), font(FS, 40, 500), font(FM, 20), font(FM, 20, 700)].map(f => document.fonts.load(f, '0123456789ABCËÉ€')));
  ctx.font = font(FD, 100);
  const m = ctx.measureText('0');
  CAP = m.actualBoundingBoxAscent / 100;
  DIGW = m.width / 100;
  buildGrain();
  buildParticles();
}
const capture = new URLSearchParams(location.search).has('capture');
window.__ready = boot();
window.__render = render;
window.__duration = DUR;
window.__seq = SEQ.map(s => ({ kind: s.kind, naam: s.naam, start: s.start, dur: s.dur }));
if (capture) {
  document.body.classList.add('capture');
} else {
  const audio = new Audio('soundtrack.wav');
  let start = performance.now();
  cv.addEventListener('click', () => { audio.currentTime = 0; audio.play().catch(() => {}); start = performance.now(); });
  window.__ready.then(() => {
    const loop = () => {
      const t = !audio.paused ? audio.currentTime : ((performance.now() - start) / 1000) % DUR;
      render(t);
      requestAnimationFrame(loop);
    };
    loop();
  });
}
</script>
