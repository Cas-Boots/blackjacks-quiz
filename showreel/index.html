<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 Showreel</title>
<style>
  @font-face { font-family: Anton; src: url(fonts/Anton.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url(fonts/Space-Grotesk_wght_500.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(fonts/Space-Grotesk_wght_700.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(fonts/JetBrains-Mono_wght_400.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(fonts/JetBrains-Mono_wght_700.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; cursor: pointer; }
  body.capture canvas { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * 2026 — a 15-second showreel. Every frame is a pure function of time,
 * so the same code plays live in the browser and renders frame-exact to video.
 * Timing is locked to 128 BPM: 8 bars, one scene per bar.
 */
const W = 1920, H = 1080, FPS = 60, DUR = 15;
const BPM = 128, B = 60 / BPM, BAR = B * 4;
const C = {
  ink: '#0B0B0E', paper: '#F2ECE1', fire: '#FF4A1C', blue: '#2F4BFF',
  lime: '#D8FF3C', mute: '#8C877E', deep: '#050507',
};
const FD = 'Anton, Impact, sans-serif';
const FS = '"Space Grotesk", sans-serif';
const FM = '"JetBrains Mono", monospace';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------------------------------------------------------------- utilities
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outQuart: t => 1 - Math.pow(1 - t, 4),
  inQuart: t => t * t * t * t,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0; let t = s;
    t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const beatPulse = (t, start = 0, k = 7) => { const u = ((t - start) % B + B) % B; return Math.exp(-u * k); };

function font(f, size, weight = '') { return `${weight} ${size}px ${f}`; }
function txt(s, x, y, o = {}) {
  const { f = FS, size = 40, weight = '', color = C.paper, align = 'center', base = 'middle', track = 0, alpha = 1, stroke = 0 } = o;
  ctx.save();
  ctx.font = font(f, size, weight);
  ctx.textAlign = align; ctx.textBaseline = base;
  ctx.letterSpacing = track + 'px';
  ctx.globalAlpha *= alpha;
  const xx = align === 'center' ? x + track / 2 : align === 'right' ? x + track : x;
  if (stroke) { ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, xx, y); }
  else { ctx.fillStyle = color; ctx.fillText(s, xx, y); }
  ctx.restore();
}
const layoutCache = new Map();
function layout(s, fnt) {
  const key = s + '|' + fnt;
  if (layoutCache.has(key)) return layoutCache.get(key);
  ctx.save(); ctx.font = fnt; ctx.letterSpacing = '0px';
  const chars = [];
  for (let i = 0; i < s.length; i++) {
    chars.push({ ch: s[i], x: ctx.measureText(s.slice(0, i)).width, w: ctx.measureText(s[i]).width });
  }
  const out = { chars, width: ctx.measureText(s).width };
  ctx.restore();
  layoutCache.set(key, out);
  return out;
}
// Anton cap metrics, measured once fonts are ready.
let CAP = 0.73, DIGW = 0.46;
function capH(size) { return CAP * size; }
// draw a glyph string vertically centred on its cap height
function digits(s, cx, cy, size, color, o = {}) {
  txt(s, cx, cy + capH(size) / 2, { f: FD, size, color, base: 'alphabetic', ...o });
}
function rect(x, y, w, h, color, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color; ctx.fillRect(x, y, w, h); ctx.restore(); }
function circle(x, y, r, color, a = 1) { if (r <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore(); }
function line(x1, y1, x2, y2, color, w = 2, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function clipRect(x, y, w, h) { ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); }
const pad2 = n => String(n).padStart(2, '0');

// calendar facts for 2026
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const MONTH_START = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
const TODAY = 272; // 30 Sep 2026, zero-based day of year
const JAN1_WEEKDAY = 4; // Thursday
function dateOf(day) {
  const d = new Date(Date.UTC(2026, 0, 1) + Math.round(day) * 864e5);
  return { m: d.getUTCMonth(), d: d.getUTCDate() };
}

// ------------------------------------------------------------ scene timing
const SCENES = [
  { name: 'THE ROLL' }, { name: 'TWENTY TWENTY-SIX' }, { name: '365 DAYS' }, { name: 'ONE ORBIT' },
  { name: 'BY THE NUMBERS' }, { name: 'HEADLINES' }, { name: 'TOTALITY' }, { name: 'A YEAR IN MOTION' },
];
const sceneAt = t => Math.min(7, Math.floor(t / BAR));

// ============================================================ SCENE 1 — reel
const REEL_TARGET = [2, 0, 2, 5];
function reelV(i, t) {
  const p = E.outExpo(P(t, 0.25, 0.95 + 0.14 * i));
  let v = REEL_TARGET[i] - (i + 1) * 10 * (1 - p);
  if (i === 3) v += E.outBack(P(t, 1.46, 1.66));
  return v;
}
function drawReelColumn(cx, cy, size, v, vPrev, color) {
  const dh = size * 1.02;
  const n = Math.min(10, 1 + Math.ceil(Math.abs(v - vPrev) * 4));
  for (let s = 0; s < n; s++) {
    const vv = n === 1 ? v : lerp(vPrev, v, (s + 1) / n);
    const base = Math.floor(vv), frac = vv - base;
    ctx.save();
    ctx.globalAlpha *= n === 1 ? 1 : Math.min(1, 1.7 / n);
    for (let k = -1; k <= 1; k++) {
      const d = ((base + k) % 10 + 10) % 10;
      digits(String(d), cx, cy + (k - frac) * dh, size, color);
    }
    ctx.restore();
  }
}
function reelLayout(t) {
  // interpolates from the small reel to the giant scene-2 layout
  const g = E.inExpo(P(t, 1.66, BAR));
  const size = lerp(300, 880, g);
  const sp = DIGW * 300 * 1.12;
  return [0, 1, 2, 3].map(i => ({
    x: lerp(W / 2 + (i - 1.5) * sp, W / 8 * (2 * i + 1), g),
    y: H / 2, size,
  }));
}
function scene1(t) {
  rect(0, 0, W, H, C.ink);
  const grow = E.outExpo(P(t, 0.02, 0.55));
  const open = E.outExpo(P(t, 0.28, 0.72));
  const blow = E.inExpo(P(t, 1.62, BAR));
  const gap = lerp(2, 400, open) + blow * 1400;
  const len = 1500 * grow;
  const yT = H / 2 - gap / 2, yB = H / 2 + gap / 2;

  // background ruler grid
  ctx.save();
  ctx.globalAlpha = 0.18 * open * (1 - blow);
  for (let x = -((t * 240) % 40); x < W; x += 40) line(x, yT - 14, x, yT - (Math.round((x + t * 240) / 40) % 5 === 0 ? 34 : 22), C.paper, 1);
  for (let x = -((t * 180) % 40) + 20; x < W; x += 40) line(x, yB + 14, x, yB + 24, C.paper, 1);
  ctx.restore();

  line(W / 2 - len / 2, yT, W / 2 + len / 2, yT, C.paper, 2);
  line(W / 2 - len / 2, yB, W / 2 + len / 2, yB, C.paper, 2);

  // the reel itself, masked by the window
  ctx.save();
  clipRect(0, yT + 1, W, gap - 2);
  const L = reelLayout(t);
  for (let i = 0; i < 4; i++) {
    const v = reelV(i, t), vp = reelV(i, t - 1 / FPS);
    drawReelColumn(L[i].x, L[i].y, L[i].size, v, vp, C.paper);
  }
  ctx.restore();

  const la = open * (1 - blow);
  txt('SETTING THE YEAR', W / 2 - 750, yT - 58, { f: FM, size: 20, align: 'left', track: 6, alpha: la, color: C.paper });
  txt('Δ +1', W / 2 + 750, yT - 58, { f: FM, size: 20, align: 'right', track: 4, alpha: la * P(t, 1.46, 1.5), color: C.fire });
  const pct = Math.round(100 * E.outExpo(P(t, 0.25, 1.46)));
  txt(`LOADING ${String(pct).padStart(3, ' ')}%`, W / 2 + 750, yB + 60, { f: FM, size: 20, align: 'right', track: 6, alpha: la, color: C.paper });
  rect(W / 2 - 750, yB + 52, 300 * pct / 100, 6, C.fire, la);
  line(W / 2 - 750, yB + 55, W / 2 - 450, yB + 55, C.paper, 1, la * 0.4);
}

// ============================================================ SCENE 2 — 2026
const S2COL = [C.fire, C.paper, C.blue, C.fire];
const S2INK = [C.ink, C.ink, C.paper, C.ink];
function scene2(lt, t) {
  const cols = [0, 1, 2, 3].map(i => ({ x: W / 8 * (2 * i + 1), y: H / 2 }));
  const size = 880;
  const b3 = lt >= 3 * B;

  // zoom into the zero on the last beat
  const zp = P(lt, 3 * B, BAR);
  const zs = Math.pow(70, E.inCubic(zp));
  const zc = cols[1];
  ctx.save();
  if (b3) {
    ctx.translate(lerp(zc.x, W / 2, E.inOutCubic(zp)), lerp(zc.y, H / 2, E.inOutCubic(zp)));
    ctx.scale(zs, zs);
    ctx.translate(-zc.x, -zc.y);
  }
  rect(-W, -H, W * 3, H * 3, b3 ? C.paper : C.ink);

  if (!b3) {
    const swap = lt >= B ? 1 : 0;
    const retract = E.inExpo(P(lt, 2 * B, 2 * B + 0.34));
    for (let i = 0; i < 4; i++) {
      const ci = (i + swap) % 4;
      const hh = H * E.outExpo(P(lt, 0.025 * i, 0.3 + 0.025 * i));
      const up = retract > 0 ? P(lt, 2 * B + 0.04 * i, 2 * B + 0.26 + 0.04 * i) : 0;
      const off = E.inExpo(up) * H * 1.05;
      const x0 = W / 4 * i;
      const top = H - hh - off;
      rect(x0, top, W / 4 + 1, hh, S2COL[ci]);
      // digit: paper over ink, inverted inside the column
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, 0, W / 4, H); ctx.clip();
      drawS2Digit(i, cols[i], size, C.paper, lt);
      ctx.beginPath(); ctx.rect(x0, top, W / 4, hh); ctx.clip();
      drawS2Digit(i, cols[i], size, S2INK[ci], lt);
      ctx.restore();
    }
    // echo outlines on beat 3
    const ep = P(lt, 2 * B, 3 * B);
    if (ep > 0) {
      for (let k = 1; k <= 5; k++) {
        const s = 1 + k * 0.07 * E.outExpo(ep);
        ctx.save();
        ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
        ctx.globalAlpha = (1 - ep) * (0.6 - k * 0.1);
        for (let i = 0; i < 4; i++) digits('2026'[i], cols[i].x, cols[i].y, size, k % 2 ? C.fire : C.paper, { stroke: 3 / s });
        ctx.restore();
      }
    }
  } else {
    for (let i = 0; i < 4; i++) digits('2026'[i], cols[i].x, cols[i].y, size, C.ink);
    // registration marks around the digits, they scale with the zoom
    ctx.save(); ctx.globalAlpha = 1 - zp;
    for (let i = 0; i < 4; i++) {
      const x = cols[i].x, y = cols[i].y + capH(size) / 2 + 60;
      txt('0' + (i + 1), x, y, { f: FM, size: 18, color: C.ink, track: 4 });
    }
    ctx.restore();
  }
  ctx.restore();

  // flash on the flip
  const fl = Math.exp(-Math.max(0, lt - 3 * B) * 16) * (b3 ? 1 : 0);
  if (fl > 0.01) rect(0, 0, W, H, '#fff', fl * 0.6);
}
function drawS2Digit(i, c, size, color, lt) {
  const ch = '2026'[i];
  const g = Math.exp(-Math.max(0, lt - B) * 8) * (lt >= B ? 1 : 0);
  if (g < 0.02) { digits(ch, c.x, c.y, size, color); return; }
  // horizontal slice glitch with RGB split
  const bands = 9, top = c.y - capH(size) / 2 - 20, bh = (capH(size) + 40) / bands;
  for (let b = 0; b < bands; b++) {
    const off = 140 * Math.sin(b * 2.3 + i * 1.7) * g * (b % 2 ? 1 : -1);
    ctx.save();
    ctx.beginPath(); ctx.rect(c.x - 400, top + b * bh, 800, bh + 1); ctx.clip();
    ctx.globalAlpha *= 0.85;
    digits(ch, c.x + off - 18 * g, c.y, size, C.fire);
    digits(ch, c.x + off + 18 * g, c.y, size, C.blue);
    ctx.globalAlpha = 1;
    digits(ch, c.x + off, c.y, size, color);
    ctx.restore();
  }
}

// ======================================================== SCENE 3 — 365 days
const GRID = { pitch: 30, cell: 24, cols: 53 };
GRID.x0 = (W - GRID.cols * GRID.pitch) / 2 + 3;
GRID.y0 = 590;
const DAY_LEVEL = (() => { const r = rng(2026); return Array.from({ length: 365 }, () => Math.floor(Math.pow(r(), 1.3) * 5)); })();
const LEVEL_COL = ['#DCD4C4', '#FFC3A6', '#FF9166', '#FF6A3D', C.fire];
const ORBIT = { cx: W / 2, cy: H / 2 + 40, rx: 640, ry: 230 };
const ORBIT_ROT = lt => lerp(-0.12, 0.05, lt / BAR);
const dayAngle = d => Math.PI / 2 + TAU * d / 365;
function orbitPos(a, rot, scale = 1) {
  const x0 = Math.cos(a) * ORBIT.rx * scale, y0 = Math.sin(a) * ORBIT.ry * scale;
  return { x: ORBIT.cx + x0 * Math.cos(rot) - y0 * Math.sin(rot), y: ORBIT.cy + x0 * Math.sin(rot) + y0 * Math.cos(rot), depth: Math.sin(a) };
}
function gridPos(d) {
  const col = Math.floor((d + JAN1_WEEKDAY) / 7), row = (d + JAN1_WEEKDAY) % 7;
  return { col, row, x: GRID.x0 + col * GRID.pitch, y: GRID.y0 + row * GRID.pitch };
}
function scene3(lt, t) {
  rect(0, 0, W, H, C.paper);
  const exitP = E.inOutExpo(P(lt, 3 * B - 0.02, BAR - 0.06));
  // ink portal expanding behind the dots
  const portal = E.inOutExpo(P(lt, 3 * B - 0.08, BAR - 0.1)) * 1200;
  if (portal > 0) circle(ORBIT.cx, ORBIT.cy, portal, C.ink);

  const punch = 1 + 0.012 * beatPulse(lt, 0, 9) * (1 - exitP);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(punch, punch); ctx.translate(-W / 2, -H / 2);

  // headline
  const hy = E.inExpo(P(lt, 3 * B - 0.1, 3 * B + 0.25)) * -420;
  ctx.save();
  clipRect(0, 150, W, 330);
  const cnt = Math.round(365 * E.outExpo(P(lt, 0.05, 1.0)));
  const rise = (1 - E.outExpo(P(lt, 0, 0.35))) * 320;
  txt(String(cnt).padStart(3, '0'), GRID.x0 - 8, 440 + rise + hy, { f: FD, size: 300, color: C.ink, align: 'left', base: 'alphabetic' });
  const lw = layout('365', font(FD, 300)).width;
  txt('DAYS', GRID.x0 + lw + 30, 330 + rise * 1.3 + hy, { f: FS, size: 76, weight: 700, color: C.ink, align: 'left', base: 'alphabetic', track: 4 });
  txt('53 WEEKS · STARTS ON A THURSDAY', GRID.x0 + lw + 34, 390 + rise * 1.6 + hy, { f: FM, size: 22, color: C.ink, align: 'left', track: 3, alpha: 0.7 });
  txt('272 DOWN · 93 TO GO', GRID.x0 + lw + 34, 432 + rise * 1.9 + hy, { f: FM, size: 22, color: C.fire, align: 'left', track: 3, alpha: P(lt, 0.9, 1.1) });
  ctx.restore();

  // month labels
  for (let m = 0; m < 12; m++) {
    const g = gridPos(MONTH_START[m]);
    const a = P(lt, 0.1 + m * 0.035, 0.3 + m * 0.035) * (1 - P(lt, 3 * B - 0.1, 3 * B + 0.05));
    txt(MONTHS[m], g.x + (g.row > 0 ? GRID.pitch : 0), GRID.y0 - 34 + (1 - a) * 14, { f: FM, size: 17, color: C.ink, align: 'left', alpha: a, track: 2 });
  }

  // cells
  const rot0 = ORBIT_ROT(0);
  for (let d = 0; d < 365; d++) {
    const g = gridPos(d);
    const delay = 0.02 + g.col * 0.011 + g.row * 0.025;
    const s = E.outBack(P(lt, delay, delay + 0.28));
    if (s <= 0) continue;
    const o = orbitPos(dayAngle(d), rot0);
    const cx = lerp(g.x + GRID.cell / 2, o.x, exitP), cy = lerp(g.y + GRID.cell / 2, o.y, exitP);
    const sz = lerp(GRID.cell, 5 + 2 * (o.depth + 1) / 2, exitP) * s;
    const past = d < TODAY, today = d === TODAY;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(cx - sz / 2, cy - sz / 2, sz, sz, lerp(4, sz / 2, exitP));
    if (today) { ctx.fillStyle = C.ink; ctx.fill(); }
    else if (past) {
      ctx.fillStyle = LEVEL_COL[DAY_LEVEL[d]];
      ctx.globalAlpha = lerp(1, 0.55, exitP);
      if (exitP > 0.5) ctx.fillStyle = C.paper;
      ctx.fill();
    } else {
      if (exitP > 0.5) { ctx.fillStyle = C.paper; ctx.globalAlpha = 0.25; ctx.fill(); }
      else { ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.35; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
    ctx.restore();
  }

  // today marker
  const tg = gridPos(TODAY);
  const ta = P(lt, 0.95, 1.1) * (1 - P(lt, 3 * B - 0.1, 3 * B + 0.05));
  if (ta > 0) {
    const tx = tg.x + GRID.cell / 2, ty = tg.y + GRID.cell / 2;
    const pr = (lt * 2) % 1;
    ctx.save(); ctx.globalAlpha = ta;
    ctx.strokeStyle = C.fire; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(tx, ty, 16 + pr * 30, 0, TAU); ctx.globalAlpha = ta * (1 - pr); ctx.stroke();
    ctx.globalAlpha = ta;
    const ly = GRID.y0 + 7 * GRID.pitch + 40;
    line(tx, ty + 18, tx, ly - 10 + (1 - E.outExpo(P(lt, 0.95, 1.2))) * -60, C.ink, 2);
    txt('YOU ARE HERE · 30 SEP', tx, ly + 10, { f: FM, size: 20, weight: 700, color: C.ink, track: 3 });
    ctx.restore();
  }
  // legend
  const lg = P(lt, 0.6, 0.8) * (1 - P(lt, 3 * B - 0.1, 3 * B + 0.05));
  txt('LESS', GRID.x0, GRID.y0 + 7 * GRID.pitch + 48, { f: FM, size: 16, color: C.ink, align: 'left', alpha: lg * 0.6, track: 2 });
  for (let k = 0; k < 5; k++) rect(GRID.x0 + 60 + k * 22, GRID.y0 + 7 * GRID.pitch + 40, 16, 16, LEVEL_COL[k], lg);
  txt('MORE', GRID.x0 + 180, GRID.y0 + 7 * GRID.pitch + 48, { f: FM, size: 16, color: C.ink, align: 'left', alpha: lg * 0.6, track: 2 });
  ctx.restore();
}

// ========================================================== SCENE 4 — orbit
const EARTH_DAYS = lt => 365 * E.inOutCubic(P(lt, 0.22, 1.42));
function scene4(lt, t) {
  rect(0, 0, W, H, C.ink);
  const rot = ORBIT_ROT(lt);
  const ed = EARTH_DAYS(lt);
  const sunGrow = E.outBack(P(lt, 0.0, 0.42));
  const fill = Math.pow(34, E.inCubic(P(lt, 3 * B + 0.02, BAR)));
  const sunR = 80 * sunGrow * (1 + 0.07 * beatPulse(lt, 0, 8)) * fill;
  const ep = orbitPos(dayAngle(ed), rot);

  // starfield
  const sr = rng(44);
  for (let i = 0; i < 140; i++) {
    const x = sr() * W, y = sr() * H, s = sr();
    circle((x - lt * 30 * s + W) % W, y, 0.6 + s * 1.3, C.paper, 0.15 + 0.35 * s * (0.6 + 0.4 * Math.sin(lt * 5 + i)));
  }
  // orbit path + day dots
  ctx.save();
  ctx.strokeStyle = C.paper; ctx.globalAlpha = 0.12; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let k = 0; k <= 180; k++) { const o = orbitPos(TAU * k / 180, rot, 1.0); k ? ctx.lineTo(o.x, o.y) : ctx.moveTo(o.x, o.y); }
  ctx.stroke(); ctx.restore();

  const drawDots = back => {
    for (let d = 0; d < 365; d++) {
      const o = orbitPos(dayAngle(d), rot);
      if ((o.depth < 0) !== back) continue;
      const passed = d <= ed;
      const since = ed - d;

// ======================================================= SCENE 7 — eclipse

  const total = lt >= TOTAL;

  // sky
  rect(0, 0, W, H, C.ink);
  ctx.save();

  sky.addColorStop(0, `rgba(255,120,60,${0.45 * (1 - dark)})`); sky.addColorStop(1, 'rgba(255,74,28,0)');

  }

  // sun glow

  const gl = ctx.createRadialGradient(sx, sy, sr * 0.8, sx, sy, sr * 3.2);
  gl.addColorStop(0, `rgba(255,140,70,${0.6 * (1 - dark) * grow})`); gl.addColorStop(1, 'rgba(255,74,28,0)');

  const sg = ctx.createRadialGradient(sx - sr * 0.3, sy - sr * 0.3, 0, sx, sy, sr);
  sg.addColorStop(0, '#FFF1DC'); sg.addColorStop(0.6, '#FFC08A'); sg.addColorStop(1, C.fire);
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();

  // moon
  const mr = SUN.r * 1.015 * (1 + Math.pow(blow, 1.2) * 9);
  circle(mx, my, mr, C.deep);

  // diamond ring
  const dr = Math.exp(-Math.pow((lt - (TOTAL - 0.05)) / 0.07, 2));
  if (dr > 0.01) {
    const px = sx + SUN.r * 0.99, py = sy - 12;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const dg = ctx.createRadialGradient(px, py, 0, px, py, 380 * dr);
    dg.addColorStop(0, `rgba(255,255,255,${dr})`); dg.addColorStop(0.15, `rgba(255,240,220,${0.6 * dr})`); dg.addColorStop(1, 'rgba(255,200,160,0)');
    ctx.fillStyle = dg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,255,255,${0.9 * dr})`;
    ctx.fillRect(px - 900 * dr, py - 1.5, 1800 * dr, 3);
    ctx.fillRect(px - 1, py - 150 * dr, 2, 300 * dr);
    ctx.restore();
  }
  const fl = total ? Math.exp(-(lt - TOTAL) * 10) : 0;
  if (fl > 0.01) rect(0, 0, W, H, '#fff', fl * 0.35);

  // type
  const line1 = 'AUG 12 · 2026 — TOTAL SOLAR ECLIPSE — 2M 18S OF DARKNESS';
  const nch = Math.floor(P(lt, 0.25, 1.05) * line1.length);
  const ta = 1 - blow;
  txt(line1.slice(0, nch) + ((Math.floor(lt * 8) % 2 || nch < line1.length) ? '▌' : ' '), W / 2, 870, { f: FM, size: 26, weight: 700, color: C.paper, track: 3, alpha: ta });
  const tt = P(lt, TOTAL, TOTAL + 0.15) * ta;
  txt('TOTALITY', W / 2, 190, { f: FS, size: 40, weight: 700, color: C.paper, track: lerp(10, 44, E.outExpo(P(lt, TOTAL, BAR))), alpha: tt });
  txt('LIGHTS OUT.', W / 2, 950, { f: FM, size: 20, color: C.fire, track: 12, alpha: tt });
}

// ======================================================== SCENE 8 — finale
let PARTS = null;
function buildParticles() {
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const o = oc.getContext('2d');
  o.fillStyle = '#fff'; o.font = font(FD, FINAL.size); o.textAlign = 'center'; o.textBaseline = 'alphabetic';
  o.fillText('2026', W / 2, FINAL.y + capH(FINAL.size) / 2);
  const data = o.getImageData(0, 0, W, H).data;
  const r = rng(314);
  PARTS = [];
  const step = 6;
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
    if (data[(y * W + x) * 4 + 3] > 128) {
      const a = r() * TAU, d = 250 + r() * 900;
      const c = r();
      PARTS.push({ tx: x + (r() - .5) * 2, ty: y + (r() - .5) * 2, mx: SUN.x + Math.cos(a) * d * 1.4, my: SUN.y + Math.sin(a) * d * 0.8, sx: SUN.x + (r() - .5) * 40, sy: SUN.y + (r() - .5) * 40, col: c < 0.7 ? 0 : c < 0.86 ? 1 : 2, dl: r() * 0.12 });
    }
  }
}
const FINAL = { size: 560, y: H / 2 - 60 };
function partPos(p, u) {
  const burst = E.outExpo(P(u, 0, 0.32));
  const q = E.inOutExpo(P(u, 0.22 + (p.tx / W) * 0.22 + p.dl, 0.78 + (p.tx / W) * 0.12 + p.dl));
  const bx = lerp(p.sx, p.mx, burst), by = lerp(p.sy, p.my, burst);
  const swirl = (1 - q) * burst * 0.6;
  const dx = bx - SUN.x, dy = by - SUN.y;
  const rx = SUN.x + dx * Math.cos(swirl) - dy * Math.sin(swirl), ry = SUN.y + dx * Math.sin(swirl) + dy * Math.cos(swirl);
  return { x: lerp(rx, p.tx, q), y: lerp(ry, p.ty, q) };
}
function scene8(lt, t) {
  rect(0, 0, W, H, C.ink);
  if (!PARTS) buildParticles();
  const solid = P(lt, 2 * B - 0.02, 2 * B + 0.1);
  const pa = 1 - P(lt, 2 * B, 2 * B + 0.25);
  if (pa > 0) {
    const cols = [C.paper, C.fire, C.blue];
    for (let c = 0; c < 3; c++) {
      ctx.save(); ctx.strokeStyle = cols[c]; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.globalAlpha = pa;
      ctx.beginPath();
      for (const p of PARTS) {
        if (p.col !== c) continue;
        const a = partPos(p, lt), b = partPos(p, lt - 1 / FPS);
        ctx.moveTo(b.x, b.y); ctx.lineTo(a.x + 0.01, a.y);
      }
      ctx.stroke(); ctx.restore();
    }
  }
  if (solid > 0) {
    const sc = lerp(1.05, 1, E.outExpo(P(lt, 2 * B, 2 * B + 0.4)));
    ctx.save();
    ctx.translate(W / 2, FINAL.y); ctx.scale(sc, sc); ctx.translate(-W / 2, -FINAL.y);
    // shine sweep on beat 4
    const sh = E.inOutCubic(P(lt, 3 * B - 0.05, 3 * B + 0.35));
    const g = ctx.createLinearGradient(0, 0, W, 0);
    const pos = lerp(-0.2, 1.2, sh);
    const st = (o, c) => { if (o >= 0 && o <= 1) g.addColorStop(o, c); };
    g.addColorStop(0, C.paper);
    st(pos - 0.12, C.paper); st(pos - 0.04, C.fire); st(pos, '#FFFFFF'); st(pos + 0.04, C.blue); st(pos + 0.12, C.paper);
    g.addColorStop(1, C.paper);
    ctx.globalAlpha = solid;
    digits('2026', W / 2, FINAL.y, FINAL.size, sh > 0 && sh < 1 ? g : C.paper);
    ctx.restore();
  }
  const fl = lt >= 2 * B ? Math.exp(-(lt - 2 * B) * 12) : 0;
  if (fl > 0.01) rect(0, 0, W, H, '#fff', fl * 0.5);

  // tri-colour underline
  const uy = FINAL.y + capH(FINAL.size) / 2 + 58;
  [C.fire, C.blue, C.paper].forEach((c, i) => {
    const p = E.outExpo(P(lt, 2 * B + 0.05 + i * 0.05, 2 * B + 0.45 + i * 0.05));
    const x0 = W / 2 - 450 + i * 300;
    rect(x0, uy, 300 * p, 8, c);
  });
  // subtitle
  const sub = 'A YEAR IN MOTION';
  const sf = font(FS, 44, 500), SL = layout(sub, sf), tr = 24;
  const sw = SL.width + tr * (sub.length - 1);
  sub.split('').forEach((ch, i) => {
    const p = E.outExpo(P(lt, 2 * B + 0.08 + i * 0.012, 2 * B + 0.3 + i * 0.012));
    txt(ch, W / 2 - sw / 2 + SL.chars[i].x + tr * i, uy + 88 + (1 - p) * 30, { f: FS, size: 44, weight: 500, color: C.paper, align: 'left', base: 'alphabetic', alpha: p });
  });
  const ca = P(lt, 3 * B, 3 * B + 0.15);
  txt('MOTION DESIGN, TYPE, CODE & SOUND — CLAUDE', W / 2, uy + 150, { f: FM, size: 18, color: C.paper, track: 6, alpha: ca * 0.6 });
  // closing letterbox
  const cl = E.inExpo(P(lt, BAR - 0.2, BAR - 0.03));
  if (cl > 0) { rect(0, 0, W, H / 2 * cl, '#000'); rect(0, H - H / 2 * cl, W, H / 2 * cl + 1, '#000'); }
}

// ============================================================== overlays
function hud(t) {
  const a = P(t, 0.15, 0.4) * (1 - P(t, DUR - 0.25, DUR - 0.1));
  if (a <= 0) return;
  const col = C.paper;
  ctx.save(); ctx.globalAlpha = a * 0.85; ctx.globalCompositeOperation = 'difference';
  const m = 44, L = 26;
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath();
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, dx, dy]) => {
    ctx.moveTo(x + dx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * L);
  });
  ctx.stroke();
  const f = Math.floor(t * FPS + 1e-6);
  const recOn = beatPulse(t, 0, 5) > 0.3;
  circle(m + 30, m + 38, 6, C.fire, recOn ? 1 : 0.3);
  txt('CLAUDE / MOTION REEL', m + 48, m + 39, { f: FM, size: 16, weight: 700, color: col, align: 'left', track: 4 });
  txt(`TC 00:00:${pad2(Math.floor(f / FPS))}:${pad2(f % FPS)}`, W - m - 26, m + 39, { f: FM, size: 16, weight: 700, color: col, align: 'right', track: 3 });
  const s = sceneAt(t);
  txt(`${pad2(s + 1)}/08  ${SCENES[s].name}`, m + 26, H - m - 40, { f: FM, size: 16, weight: 700, color: col, align: 'left', track: 4 });
  txt('1920×1080 · 60 FPS · 128 BPM', W - m - 26, H - m - 40, { f: FM, size: 16, color: col, align: 'right', track: 3 });
  // progress
  const px0 = m + 26, px1 = W - m - 26, py = H - m - 16;
  line(px0, py, px1, py, col, 1, 0.3);
  line(px0, py, lerp(px0, px1, t / DUR), py, col, 3);
  for (let k = 1; k < 8; k++) { const x = lerp(px0, px1, k * BAR / DUR); line(x, py - 5, x, py + 5, col, 1, 0.6); }
  ctx.restore();
}
let GRAIN = [];
function buildGrain() {
  const r = rng(5);
  for (let k = 0; k < 4; k++) {
    const g = document.createElement('canvas'); g.width = 700; g.height = 400;
    const o = g.getContext('2d'); const im = o.createImageData(700, 400);
    for (let i = 0; i < im.data.length; i += 4) { const v = Math.floor(r() * 255); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    o.putImageData(im, 0, 0); GRAIN.push(g);
  }
}
function post(t) {
  const f = Math.floor(t * FPS + 1e-6);
  ctx.save();
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.1;
  const r = rng(f + 1);
  ctx.drawImage(GRAIN[f % 4], -r() * 180, -r() * 100, 2100, 1200);
  ctx.restore();
  ctx.save();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.15);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
const IMPACTS = [[BAR, 16], [2 * BAR, 6], [4 * BAR, 12], [6 * BAR + 3 * B, 14], [7 * BAR + 2 * B, 12], [5 * BAR + 2 * B + 0.34, 6]];
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, amp] of IMPACTS) {
    if (t < ti) continue;
    const d = Math.exp(-(t - ti) * 13) * amp;
    x += Math.sin((t - ti) * 95) * d; y += Math.cos((t - ti) * 71) * d;
  }
  return [x, y];
}

// ================================================================ render
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  rect(0, 0, W, H, '#000');
  const [sx, sy] = shake(t);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.translate(W / 2, H / 2); ctx.scale(1 + Math.hypot(sx, sy) / 900, 1 + Math.hypot(sx, sy) / 900); ctx.translate(-W / 2, -H / 2);
  const s = sceneAt(t), lt = t - s * BAR;
  [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8][s](s === 0 ? t : lt, t);
  ctx.restore();
  hud(t);
  post(t);
}

// ================================================================== boot
async function boot() {
  await document.fonts.ready;
  await Promise.all([font(FD, 100), font(FS, 40, 700), font(FS, 40, 500), font(FM, 20), font(FM, 20, 700)].map(f => document.fonts.load(f, '0123456789ABC丙午')));
  ctx.font = font(FD, 100);
  const m = ctx.measureText('0');
  CAP = m.actualBoundingBoxAscent / 100;
  DIGW = m.width / 100;
  buildGrain();
  buildParticles();
}
const capture = new URLSearchParams(location.search).has('capture');
window.__ready = boot();
window.__render = render;
if (capture) {
  document.body.classList.add('capture');
} else {
  // live playback: click to play with the soundtrack
  const audio = new Audio('soundtrack.wav');
  let start = performance.now();
  cv.addEventListener('click', () => { audio.currentTime = 0; audio.play().catch(() => {}); start = performance.now(); });
  window.__ready.then(() => {
    const loop = () => {
      const t = !audio.paused ? audio.currentTime : ((performance.now() - start) / 1000) % DUR;
      render(t);
      requestAnimationFrame(loop);
    };
    loop();
  });
}
</script>
