services:
  quiz:
    build: .
    ports:
      - '3000:3000'
    environment:
      # Verander deze pincode vóór de avond.
      HOST_PIN: ${HOST_PIN:-2627}
      DATABASE_PATH: /data/quiz.db
      PORT: '3000'
    volumes:
      # De stand overleeft een herstart van de container.
      - quiz-data:/data
      # Foto's, filmpjes en muziek bij vragen. Bestand erin zetten is genoeg.
      - ./media:/app/media
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  quiz-data:
